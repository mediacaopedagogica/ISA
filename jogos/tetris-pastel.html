<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#cdb8ff"><title>Tetris Pastel</title><style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:linear-gradient(135deg,#dfe0ff,#f8d8ef,#d9dcff);font-family:Arial,sans-serif;color:#3b2b70}.app{max-width:1180px;margin:auto;padding:18px}.top{display:grid;grid-template-columns:1.7fr .55fr .55fr .55fr;gap:14px;align-items:center;margin-bottom:16px}.brand{position:relative}.brand .m{font-size:clamp(36px,5vw,62px);font-weight:1000;line-height:.8;color:#fff;text-shadow:0 4px #6331b1,0 8px 13px #5c299c88}.brand .d{font-size:clamp(38px,5.2vw,66px);font-weight:1000;line-height:.96;color:#ff82b6;text-shadow:0 4px #6833ad,0 7px 12px #6a35a477}.ribbon{display:inline-block;margin-left:25%;padding:7px 24px;background:linear-gradient(90deg,#7650dc,#983bd0);color:#fff;font-weight:900;clip-path:polygon(0 0,100% 0,94% 100%,6% 88%)}.spark{position:absolute;left:42%;top:-16px;font-size:34px;color:#ffd96b}.stat,.restart{background:#fff;border:2px solid #fff;border-radius:18px;min-height:82px;box-shadow:0 8px 24px #60479b2b;text-align:center;padding:11px;font-weight:900}.small{font-size:11px}.count{font-size:25px;color:#3b20a3}.restart{cursor:pointer;color:#3b2b70}.layout{display:grid;grid-template-columns:minmax(320px,520px) minmax(300px,1fr);gap:18px;align-items:stretch}.boardWrap{display:flex;justify-content:center}.board{position:relative;width:min(100%,430px);aspect-ratio:1/2;border-radius:24px;overflow:hidden;background:linear-gradient(#171244,#292263 65%,#171341);border:2px solid #50468f;box-shadow:0 14px 35px #34256c66}.board:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:10% 5%;opacity:.45}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.side{background:linear-gradient(145deg,#fffbea,#fff0fa);border:2px solid #fff;border-radius:24px;padding:16px;box-shadow:0 12px 28px #6a438d38;display:flex;flex-direction:column;gap:14px}.panel{background:linear-gradient(#fff9f1,#fff6fb);border:1px solid #f1e1e7;border-radius:19px;padding:16px}.panel h2{margin:0 0 8px;font-size:22px}.nextBox{height:150px;border-radius:16px;background:#292263;display:grid;place-items:center;overflow:hidden}.nextBox canvas{position:static;width:140px;height:120px}.help{background:linear-gradient(135deg,#ffd4e9,#f7c3df);border-radius:18px;padding:15px;text-align:center;font-weight:900;line-height:1.4}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ctrl{border:0;border-radius:15px;padding:13px 8px;background:#fff;color:#4d397c;font-weight:1000;box-shadow:0 5px 14px #6b4a8b22;touch-action:manipulation}.ctrl.big{grid-column:span 3;background:linear-gradient(90deg,#bda8ed,#9fc8f2)}.status{font-weight:900;text-align:center;min-height:24px;color:#68419a}.bottom{margin-top:14px;background:#fff;border:2px solid #fff;border-radius:18px;padding:13px;text-align:center;font-weight:900;box-shadow:0 8px 20px #6a438d20}
@media(max-width:760px){.app{padding:10px}.top{grid-template-columns:1fr 1fr;gap:8px}.brand{grid-column:1/-1;text-align:center}.ribbon{margin-left:0}.stat,.restart{min-height:64px;padding:7px}.small{font-size:9px}.count{font-size:20px}.layout{grid-template-columns:1fr}.board{width:min(92vw,380px)}.side{padding:12px}.nextBox{height:120px}.bottom{font-size:12px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><span class="spark">✦</span><div class="m">✨ Tetris</div><div class="d">Pastel</div><div class="ribbon">BLOCOS COLORIDOS</div></div><div class="stat">⭐<div class="small">Pontos</div><div class="count" id="score">0</div></div><div class="stat">🧩<div class="small">Linhas</div><div class="count" id="lines">0</div></div><button class="restart" id="restart">⟳ Reiniciar</button></header><div class="layout"><div class="boardWrap"><section class="board"><canvas id="game"></canvas></section></div><aside class="side"><div class="panel"><h2>Próxima peça ✨</h2><div class="nextBox"><canvas id="next"></canvas></div></div><div class="panel"><h2>Nível <span id="level">1</span></h2><div id="status" class="status">Monte linhas completas para fazê-las desaparecer.</div></div><div class="controls"><button class="ctrl" data-act="left">←</button><button class="ctrl" data-act="rotate">↻</button><button class="ctrl" data-act="right">→</button><button class="ctrl" data-act="down">↓</button><button class="ctrl big" data-act="drop">⬇ Soltar peça</button></div><div class="help">🎮 <strong>Como jogar</strong><br>Setas movem, ↑ gira, ↓ acelera e espaço solta a peça.</div></aside></div><div class="bottom">💡 Complete linhas horizontais. Quanto mais linhas, mais rápido o jogo fica.</div></main><script>
const COLS=10,ROWS=20,SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const COLORS=['#f178aa','#78b8ec','#a973df','#7fd17b','#f5bd3e','#ff9c76','#81d8d0'];const KEYS=Object.keys(SHAPES);
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
let board=[],piece=null,nextPiece=null,score=0,lines=0,level=1,last=0,acc=0,over=false,raf=0;
function blank(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function randomPiece(){const type=KEYS[Math.floor(Math.random()*KEYS.length)],color=COLORS[Math.floor(Math.random()*COLORS.length)];return{type,matrix:SHAPES[type].map(r=>r.slice()),color,x:Math.floor((COLS-SHAPES[type][0].length)/2),y:-1}}
function rotate(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function collides(p,dx=0,dy=0,m=p.matrix){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&board[ny][nx])return true}return false}
function merge(){for(let y=0;y<piece.matrix.length;y++)for(let x=0;x<piece.matrix[y].length;x++)if(piece.matrix[y][x]){const by=piece.y+y,bx=piece.x+x;if(by<0){gameOver();return}board[by][bx]=piece.color}if(over)return;clearLines();spawn()}
function clearLines(){let cleared=0;for(let y=ROWS-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(null));cleared++;y++}}if(cleared){const gain=[0,100,300,500,800][cleared]*level;score+=gain;lines+=cleared;level=1+Math.floor(lines/10);document.getElementById('status').textContent=`+${gain} pontos! ${cleared} linha${cleared>1?'s':''} limpa${cleared>1?'s':''}.`;hud()}}
function spawn(){piece=nextPiece||randomPiece();piece.x=Math.floor((COLS-piece.matrix[0].length)/2);piece.y=-1;nextPiece=randomPiece();drawNext();if(collides(piece,0,1)&&collides(piece,0,0))gameOver()}
function gameOver(){over=true;document.getElementById('status').textContent='Fim da rodada 💜 Toque em Reiniciar quando quiser.';cancelAnimationFrame(raf)}
function cell(ctx,x,y,size,color){const pad=Math.max(1,size*.08);ctx.fillStyle=color;ctx.shadowColor='rgba(255,255,255,.55)';ctx.shadowBlur=size*.12;roundRect(ctx,x*size+pad,y*size+pad,size-pad*2,size-pad*2,size*.16);ctx.fill();ctx.shadowBlur=0;const g=ctx.createLinearGradient(0,y*size,0,(y+1)*size);g.addColorStop(0,'rgba(255,255,255,.38)');g.addColorStop(.42,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(0,0,0,.14)');ctx.fillStyle=g;roundRect(ctx,x*size+pad,y*size+pad,size-pad*2,size-pad*2,size*.16);ctx.fill()}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function resize(){const r=canvas.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,size=Math.min(w/COLS,h/ROWS);ctx.clearRect(0,0,w,h);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x])cell(ctx,x,y,size,board[y][x]);if(piece){for(let y=0;y<piece.matrix.length;y++)for(let x=0;x<piece.matrix[y].length;x++)if(piece.matrix[y][x]&&piece.y+y>=0)cell(ctx,piece.x+x,piece.y+y,size,piece.color)}}
function drawNext(){const w=nextCanvas.width=280,h=nextCanvas.height=240;nctx.clearRect(0,0,w,h);if(!nextPiece)return;const s=42,ox=(w-nextPiece.matrix[0].length*s)/2,oy=(h-nextPiece.matrix.length*s)/2;for(let y=0;y<nextPiece.matrix.length;y++)for(let x=0;x<nextPiece.matrix[y].length;x++)if(nextPiece.matrix[y][x]){nctx.save();nctx.translate(ox,oy);cell(nctx,x,y,s,nextPiece.color);nctx.restore()}}
function move(dx){if(over||collides(piece,dx,0))return;piece.x+=dx;draw()}
function down(){if(over)return;if(!collides(piece,0,1)){piece.y++;score+=1}else merge();hud();draw()}
function doRotate(){if(over)return;const m=rotate(piece.matrix);if(!collides(piece,0,0,m)){piece.matrix=m}else if(!collides(piece,-1,0,m)){piece.x--;piece.matrix=m}else if(!collides(piece,1,0,m)){piece.x++;piece.matrix=m}draw()}
function hardDrop(){if(over)return;let n=0;while(!collides(piece,0,1)){piece.y++;n++}score+=n*2;merge();hud();draw()}
function hud(){document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;document.getElementById('level').textContent=level}
function tick(t){if(over)return;const dt=t-last;last=t;acc+=dt;const speed=Math.max(120,780-(level-1)*65);if(acc>speed){if(!collides(piece,0,1))piece.y++;else merge();acc=0;draw()}raf=requestAnimationFrame(tick)}
function reset(){cancelAnimationFrame(raf);board=blank();score=0;lines=0;level=1;over=false;nextPiece=randomPiece();spawn();hud();document.getElementById('status').textContent='Monte linhas completas para fazê-las desaparecer.';last=performance.now();acc=0;draw();raf=requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')move(-1);if(e.code==='ArrowRight')move(1);if(e.code==='ArrowDown')down();if(e.code==='ArrowUp')doRotate();if(e.code==='Space')hardDrop()});
document.querySelectorAll('[data-act]').forEach(b=>{const act=b.dataset.act;b.addEventListener('pointerdown',e=>{e.preventDefault();if(act==='left')move(-1);if(act==='right')move(1);if(act==='down')down();if(act==='rotate')doRotate();if(act==='drop')hardDrop()})});document.getElementById('restart').onclick=reset;window.addEventListener('resize',resize);reset();resize();
</script></body></html>
