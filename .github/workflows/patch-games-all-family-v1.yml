name: Patch games for all family profiles v1
on:
  push:
    paths:
      - '.github/workflows/patch-games-all-family-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include Evalda in Joguinhos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games-menu.js')
          s=p.read_text()
          old="['isa','keise','alan','paloma','elion','vania','davi']"
          new="['isa','keise','alan','paloma','elion','vania','evalda','davi']"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('eligible family list marker not found')
          PY
          node --check games-menu.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games-menu.js
          git commit -m 'fix: allow Joguinhos for Evalda and all family profiles'
          git push
