name: Fix conversation loader v58
on:
  push:
    paths:
      - '.github/workflows/fix-conversation-loader-v58.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch conversation loader
        run: |
          python scripts/fix_conversation_loader_v58.py
          node --check app-v33.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v33.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make conversation loading non-blocking on phone and notebook'
          git push
