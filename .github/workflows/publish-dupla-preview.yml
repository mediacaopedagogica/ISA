name: Publish Dupla na Pista preview
on:
  push:
    paths:
      - '.github/workflows/publish-dupla-preview.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply manual steering patch
        shell: bash
        run: |
          python scripts/patch_dupla_manual_arcade_v1.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('jogos/dupla-na-pista-teste.html').read_text()
          m=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('module not found')
          Path('/tmp/dupla.mjs').write_text(m[-1])
          PY
          node --check /tmp/dupla.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          if git diff --cached --quiet; then
            echo 'No game changes to publish.'
            exit 0
          fi
          git commit -m 'fix: manual steering and natural body movement'
          git push
