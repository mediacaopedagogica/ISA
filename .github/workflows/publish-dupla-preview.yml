name: Publish Dupla na Pista preview
on:
  push:
    paths:
      - '.github/workflows/publish-dupla-preview.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write private preview build
        shell: bash
        run: |
          mkdir -p jogos
          echo '' | base64 -d | gzip -d > jogos/dupla-na-pista-teste.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("./postboot-loader.js?v=21-alan-studio-locked","./postboot-loader.js?v=22-alan-supervision-game")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: publish private Dupla na Pista 3D preview'
          git push
