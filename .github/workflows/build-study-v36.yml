name: Build Estudos v36

on:
  push:
    branches: [main]
    paths:
      - 'study*.js'
      - '!study-bundle-v36.js'
      - 'retention-notice.js'
      - 'periodic-data.js'
      - 'config.js'
      - '.github/workflows/build-study-v36.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar dependências
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild @supabase/supabase-js >/dev/null 2>&1
      - name: Trocar import remoto do Supabase somente no workspace do build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('.').glob('study*.js')) + [Path('retention-notice.js')]
          old = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
          for p in files:
              if not p.exists() or p.name == 'study-bundle-v36.js':
                  continue
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, '@supabase/supabase-js'), encoding='utf-8')
          PY
      - name: Gerar e validar bundle local
        run: |
          npx esbuild study-entry-v36.js --bundle --format=iife --platform=browser --target=es2020 --outfile=study-bundle-v36.js
          node --check study-bundle-v36.js
      - name: Restaurar somente fontes temporariamente alteradas
        run: |
          git diff --name-only | while IFS= read -r p; do
            if [ -n "$p" ] && [ "$p" != "study-bundle-v36.js" ]; then
              git restore -- "$p"
            fi
          done
      - name: Publicar bundle sem perder commits concorrentes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study-bundle-v36.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Gerar bundle local de Estudos v36'
          git pull --rebase origin main
          git push origin main
