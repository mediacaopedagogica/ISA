name: Smoke loading v3
on:
  push:
    paths:
      - '.github/workflows/smoke-loading-v1.yml'
      - 'index.html'
      - 'final-shell-bootstrap-v3.js'
      - 'keise-approved-layout-final.js'
      - 'keise-approved-layout-final.css'
      - 'personal-boot-failopen-v1.js'
      - 'acesso.html'
      - 'acesso-mobile.html'
      - 'familia-externa.js'
      - 'external-safe-loader-v71.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
      - name: Verify approved Keise shell and external loaders
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='https://mediacaopedagogica.github.io/ISA/';
          async function committedPage(url){
            const p=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto(url,{waitUntil:'commit',timeout:25000});
            return {p,errors};
          }
          async function root(){
            const {p,errors}=await committedPage(base+'?perfil=keise&smoke='+Date.now());
            await p.waitForTimeout(4500);
            // O smoke não possui a sessão privada da Keise. Simula somente a passagem
            // login -> app já autenticado para validar qual shell visual assume a tela.
            await p.evaluate(()=>{
              document.getElementById('loginView')?.classList.add('hidden');
              document.getElementById('mainView')?.classList.remove('hidden');
              const n=document.getElementById('myName');if(n)n.textContent='Keise';
              window.__ISA_APP_READY__=true;
              document.dispatchEvent(new CustomEvent('isa:core-ready'));
              window.__ISA_FINAL_SHELL__?.scan?.();
            });
            await p.waitForTimeout(5000);
            const s=await p.evaluate(()=>{
              const guard=document.getElementById('personalBootGuard');
              const approvedGuard=document.getElementById('isaKeiseApprovedGuard');
              const home=document.getElementById('keiseApprovedHome');
              const sidebar=document.querySelector('#mainView>.sidebar');
              return {
                guard:!!guard&&!guard.classList.contains('hidden'),
                approvedGuard:!!approvedGuard,
                final:!!home&&!home.classList.contains('hidden'),
                bodyApproved:document.body.classList.contains('keise-approved-layout')&&document.body.classList.contains('keise-home-active'),
                sidebarDisplay:sidebar?getComputedStyle(sidebar).display:'missing',
                featureCount:document.querySelectorAll('#keiseApprovedHome [data-ka-action]').length,
                oldWelcomeVisible:[...document.querySelectorAll('#emptyState')].some(el=>getComputedStyle(el).display!=='none'&&!el.classList.contains('hidden')),
                last:window.__ISA_LAST_RUNTIME_ERROR__||'',
                ready:document.readyState
              };
            });
            console.log('KEISE_APPROVED',JSON.stringify(s),'errors=',errors);
            await p.close();
            if(s.guard||s.approvedGuard||!s.final||!s.bodyApproved||s.sidebarDisplay!=='none'||s.featureCount<9||s.oldWelcomeVisible){
              throw new Error('Layout aprovado da Keise não assumiu sozinho a tela: '+JSON.stringify(s));
            }
          }
          async function external(file){
            const {p,errors}=await committedPage(base+file+'?smoke='+Date.now()+'#acesso=smoke-invalid');
            await p.waitForTimeout(13500);
            const s=await p.evaluate(()=>({state:window.__ISA_FRIEND_BOOTSTRAP_STATE__||'',early:window.__ISA_EXTERNAL_EARLY_RELEASED__||false,title:document.getElementById('friendGateTitle')?.textContent||'',button:!!document.querySelector('#friendEnterBtn:not(.hidden)'),chat:!!document.querySelector('#friendChat:not(.hidden)'),ready:document.readyState}));
            console.log(file,JSON.stringify(s),'errors=',errors);
            await p.close();
            if(s.state==='loading'&&!s.button&&!s.chat)throw new Error(file+' ficou preso verificando acesso: '+JSON.stringify(s));
          }
          await root();
          await Promise.all([external('acesso-mobile.html'),external('acesso.html')]);
          await browser.close();
          JS
          node smoke.mjs
