name: Publish Alan band management v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alan-band-management-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Alan band management
        run: |
          node --check alan-band-management.js
          grep -q "alan-band-management.js?v=1-edital" extras-loader.js
          grep -q "alan_band_management_load" alan-band-management.js
          grep -q "Filmagem & Produção" alan-band-management.js
          grep -q "Editais & Projetos" alan-band-management.js
      - name: Refresh postboot cache in index
        run: |
          sed -i "s#postboot-loader.js?v=15-alan-workshop#postboot-loader.js?v=16-alan-band-management#g" index.html
          grep -q "postboot-loader.js?v=16-alan-band-management" index.html
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache refresh needed"
          else
            git commit -m "Publish Alan band management v1"
            git push
          fi