name: Publish Alan studio lock
on:
  push:
    paths:
      - '.github/workflows/publish-alan-studio-lock.yml'
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate modules
        run: |
          node --check alan-studio-access.js
          node --check keise-alan-studio-control.js
          node --check extras-loader.js
          grep -q "isAlanStudioEnabled" extras-loader.js
          grep -q "keise-alan-studio-control" extras-loader.js
          grep -q "alan-genre-studios" extras-loader.js
      - name: Refresh index cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='./postboot-loader.js?v=20-alan-full-studio-score'
          new='./postboot-loader.js?v=21-alan-studio-locked'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('postboot cache marker not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish Alan studio access lock'
          git push
