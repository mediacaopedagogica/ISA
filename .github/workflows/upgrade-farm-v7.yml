name: Upgrade Fazendinha v7 realism

on:
  push:
    paths:
      - '.github/workflows/upgrade-farm-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build natural-model upgrade
        run: python scripts/upgrade-farm-v7.py
      - name: Verify farm before commit
        run: |
          node --check jogos/fazendinha-experience-v6.js
          grep -q 'Michelle.glb' jogos/fazendinha-experience-v6.js
          grep -q 'Cow.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'Pig.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'polishInterior' jogos/fazendinha-experience-v6.js
          grep -q 'camera360Btn' jogos/fazendinha-multiplayer.html
          grep -q 'eyeCameraBtn' jogos/fazendinha-multiplayer.html
          grep -q 'data-tool="fish"' jogos/fazendinha-multiplayer.html
          grep -q 'v=7-natural-models' games-menu-farm.js
          grep -q "function eligible(){return currentName()==='isa'}" games-menu-farm.js
          ! grep -q 'games-menu-farm.js' acesso.html
          ! grep -q 'games-menu-farm.js' acesso-mobile.html
      - name: Commit upgraded farm
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/fazendinha-experience-v6.js jogos/fazendinha-multiplayer.html games-menu-farm.js extras-loader.js postboot-loader.js index.html .github/workflows/validate-farm-multiplayer.yml
          git diff --cached --quiet || git commit -m 'Upgrade Fazendinha to natural 3D models v7'
          git push
