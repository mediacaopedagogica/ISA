name: Fix Dupla fluid driving v1.1.4
on:
  push:
    paths:
      - '.github/workflows/fix-dupla-fluid-driving-v114.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove magnetic locking and smooth vehicle physics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('jogos/dupla-na-pista-teste.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('v1.1.3 • W/↑ frente • S/↓ ré','v1.1.4 • movimento livre + colisão suave')
          s=s.replace('v1.1.3','v1.1.4')

          # Chassi menos amortecido: deixa o carro responder e girar com naturalidade.
          s=s.replace('linearDamping:.012,angularDamping:.42','linearDamping:.008,angularDamping:.24')

          # Pista física: separa guard-rail do asfalto para o contato usar o material de baixa fricção.
          new_track = r'''function buildPhysicalTrack(track){const N=isMobile()?112:168;for(let i=0;i<N;i++){const t0=i/N,t1=(i+1)/N,q0=roadPoint(t0,track,0,.035),q1=roadPoint(t1,track,0,.035),len=Math.max(.5,Math.hypot(q1.x-q0.x,q1.y-q0.y,q1.z-q0.z)),px=(q0.x+q1.x)/2,py=(q0.y+q1.y)/2,pz=(q0.z+q1.z)/2,rot=segQuat(q0,q1);const road=new CANNON.Body({mass:0,material:roadPhysMat});road.position.set(px,py,pz);road.quaternion.copy(rot);road.addShape(new CANNON.Box(new CANNON.Vec3(11.5,.07,len/2+.12)),new CANNON.Vec3(0,-.23,0));road.addShape(new CANNON.Box(new CANNON.Vec3(4.74,.09,len/2+.14)),new CANNON.Vec3(0,-.08,0));physicsWorld.addBody(road);const rails=new CANNON.Body({mass:0,material:barrierPhysMat});rails.position.set(px,py,pz);rails.quaternion.copy(rot);const railShape=new CANNON.Box(new CANNON.Vec3(.11,.61,len/2+.10));rails.addShape(railShape,new CANNON.Vec3(-5.18,.61,0));rails.addShape(railShape,new CANNON.Vec3(5.18,.61,0));physicsWorld.addBody(rails)}}buildPhysicalTrack(TRACK_A);buildPhysicalTrack(TRACK_B);'''
          s,n=re.subn(r'function buildPhysicalTrack\(track\)\{.*?\}buildPhysicalTrack\(TRACK_A\);buildPhysicalTrack\(TRACK_B\);',new_track,s,count=1,flags=re.S)
          assert n==1, 'buildPhysicalTrack patch not applied'

          # Suspensão/pneu menos "colados" ao chão.
          s=s.replace('suspensionStiffness:48,suspensionRestLength:.34,frictionSlip:4.4,dampingRelaxation:2.5,dampingCompression:4.6,maxSuspensionForce:120000,rollInfluence:.055',
                      'suspensionStiffness:43,suspensionRestLength:.36,frictionSlip:3.25,dampingRelaxation:2.15,dampingCompression:3.7,maxSuspensionForce:105000,rollInfluence:.075')

          # Aceleração progressiva, 4x4 leve, coasting sem freio invisível e ré natural.
          new_input = r'''function setRaycastInput(i,enabled,dt=.016){const pv=vehiclePhysics[i],rv=pv.vehicle,b=pv.body,s=states[i],fw=physicsForward(pv),signed=b.velocity.dot(fw),kmh=Math.abs(signed)*3.6,left=enabled&&(keys.ArrowLeft||keys.a||keys.A),right=enabled&&(keys.ArrowRight||keys.d||keys.D),acc=enabled&&(keys.ArrowUp||keys.w||keys.W),down=enabled&&(keys.ArrowDown||keys.s||keys.S),steerIn=(left?1:0)-(right?1:0),speedRatio=THREE.MathUtils.clamp(kmh/145,0,1),maxSteer=THREE.MathUtils.degToRad(32-22*speedRatio),target=steerIn*maxSteer;pv.steer=THREE.MathUtils.lerp(pv.steer,target,1-Math.exp(-(steerIn?7.8:11.5)*dt));rv.setSteeringValue(pv.steer,0);rv.setSteeringValue(pv.steer,1);pv.throttleHold=acc?Math.min(2.2,(pv.throttleHold||0)+dt*1.85):Math.max(0,(pv.throttleHold||0)-dt*3.4);const ramp=THREE.MathUtils.clamp(pv.throttleHold/1.65,0,1),ease=ramp*ramp*(3-2*ramp),motorHealth=Math.max(.4,s.motor/100);let engine=0,brake=0;if(!enabled){brake=150;pv.throttleHold=0}else if(acc){if(signed<-.65){brake=520}else{const force=9500+(31500-9500)*ease,speedFade=kmh<195?1:Math.max(.06,1-(kmh-195)/55);engine=-force*motorHealth*speedFade}}else if(down){pv.throttleHold=0;if(signed>.65){brake=720}else{engine=9000*motorHealth*Math.max(.22,1-kmh/68)}}else{brake=0}const onRoad=Math.abs(s.lat)<4.45,grip=(onRoad?3.25:1.85)*THREE.MathUtils.clamp(s.tires/100,.58,1);for(let w=0;w<4;w++){rv.setBrake(brake,w);rv.wheelInfos[w].frictionSlip=grip}rv.applyEngineForce(engine*.30,0);rv.applyEngineForce(engine*.30,1);rv.applyEngineForce(engine*.70,2);rv.applyEngineForce(engine*.70,3)}'''
          s,n=re.subn(r'function setRaycastInput\(i,enabled,dt=\.016\)\{.*?\}\n\nfunction zoneAt',new_input+'\n\nfunction zoneAt',s,count=1,flags=re.S)
          assert n==1, 'setRaycastInput patch not applied'

          # Remove o "ímã" que empurrava o carro de volta ao centro e dava sensação de travamento.
          new_recovery = r'''for(let i=0;i<2;i++){const s=states[i],pv=vehiclePhysics[i],near=i===0?near0:near1;if(pv.body.position.y<near.q.y-2.2||Math.abs(s.lat)>18){const q=roadPoint(s.t,tracks[i],THREE.MathUtils.clamp(s.lat,-2.2,2.2),.035),yaw=Math.atan2(near.f.tan.x,near.f.tan.z);pv.body.position.set(q.x,q.y+1.15,q.z);pv.body.quaternion.setFromEuler(0,yaw,0,'XYZ');pv.body.velocity.set(0,0,0);pv.body.angularVelocity.set(0,0,0);msg('↺ Veículo recuperado após sair totalmente da pista')}}'''
          s,n=re.subn(r'for\(let i=0;i<2;i\+\+\)\{const s=states\[i\],pv=vehiclePhysics\[i\],near=i===0\?near0:near1;.*?\}\}const f=orientCar\(active\);',new_recovery+'const f=orientCar(active);',s,count=1,flags=re.S)
          assert n==1, 'magnetic rail patch not applied'

          # Melhora a estabilidade numérica sem atrasar a resposta do teclado.
          s=s.replace('physicsWorld.step(1/60,dt,4);','physicsWorld.step(1/120,dt,8);')

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          git commit -m 'fix: free vehicle movement and barrier collisions v1.1.4'
          git push
