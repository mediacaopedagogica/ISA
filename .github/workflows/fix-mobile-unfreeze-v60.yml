name: Fix mobile taps v60
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-unfreeze-v60.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump mobile recovery assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            './mobile-interaction-guard.js?v=5-unfreeze-main':'./mobile-interaction-guard.js?v=6-native-tap',
            './postboot-loader.js?v=32-unfreeze-main':'./postboot-loader.js?v=33-progressive-mobile',
            './sw.js?v=unfreeze-59':'./sw.js?v=unfreeze-60-native-tap',
          }
          for old,new in replacements.items():
            if old not in s and new not in s:
              raise SystemExit(f'marker not found: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check mobile-interaction-guard.js
          node --check postboot-loader.js
          node --check familia-externa.js
          python - <<'PY'
          from pathlib import Path
          h=Path('acesso-mobile.html').read_text()
          f=Path('familia-externa.js').read_text()
          g=Path('mobile-interaction-guard.js').read_text()
          assert 'isa:friend-portal-entered' in h and 'isa:friend-portal-entered' in f
          assert "document.addEventListener('touchend'" not in g
          assert 'friendExitBtn' in f
          assert 'Promise.allSettled(paths.map' not in Path('postboot-loader.js').read_text()
          print('Mobile interaction quality gate: OK')
          PY
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed'
          else
            git commit -m 'fix: unfreeze mobile taps and progressive extras'
            git push
          fi
