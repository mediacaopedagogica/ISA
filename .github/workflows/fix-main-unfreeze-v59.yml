name: Fix main profile unfreeze v59
on:
  push:
    paths:
      - '.github/workflows/fix-main-unfreeze-v59.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./app-v33.js?v=stable-58-nonblocking-conversations','./app-v33.js?v=stable-59-unfreeze-main')
          s=s.replace('./postboot-loader.js?v=31-nossa-rede-all-profiles','./postboot-loader.js?v=32-unfreeze-main')
          old="""    const main=document.getElementById('mainView'),name=String(document.getElementById('myName')?.textContent||'').trim();
    const list=document.getElementById('chatList'),coreReady=!list||!/Carregando conversas/i.test(list.textContent||'');
    if(main&&!main.classList.contains('hidden')&&name&&name!=='Família'&&coreReady){"""
          new="""    const main=document.getElementById('mainView'),name=String(document.getElementById('myName')?.textContent||'').trim();
    // Nossa Rede, Configurações e Teste Jogo não dependem da lista de conversas.
    if(main&&!main.classList.contains('hidden')&&name&&name!=='Família'){"""
          if old not in s:
              raise SystemExit('loader gate not found')
          s=s.replace(old,new,1)
          watchdog="""
<script>
(function(){
  const KEY='isa-main-chat-recovery-v59';
  const stuck=()=>{
    const main=document.getElementById('mainView'),list=document.getElementById('chatList');
    return !!main&&!main.classList.contains('hidden')&&!!list&&/Carregando conversas/i.test(list.textContent||'');
  };
  const clear=()=>{try{sessionStorage.removeItem(KEY)}catch{}};
  const list=document.getElementById('chatList');
  if(list)new MutationObserver(()=>{if(!stuck())clear()}).observe(list,{childList:true,subtree:true,characterData:true});
  setTimeout(()=>{
    if(!stuck()){clear();return}
    let retried=false;try{retried=sessionStorage.getItem(KEY)==='1'}catch{}
    if(!retried){
      try{sessionStorage.setItem(KEY,'1')}catch{}
      const u=new URL(location.href);u.searchParams.set('_fresh',Date.now().toString());location.replace(u.toString());return
    }
    const box=document.getElementById('chatList');if(!box)return;
    box.innerHTML='<div class="muted" style="padding:12px;line-height:1.5">As conversas demoraram para carregar, mas o restante do Cantinho continua disponível.<br><button id="mainChatReloadBtn" class="tiny-btn" type="button" style="margin-top:8px">Recarregar conversas</button></div>';
    document.getElementById('mainChatReloadBtn')?.addEventListener('click',()=>{clear();const u=new URL(location.href);u.searchParams.set('_fresh',Date.now().toString());location.replace(u.toString())});
  },9000);
})();
</script>
"""
          if 'isa-main-chat-recovery-v59' not in s:
              s=s.replace('</body>',watchdog+'</body>',1)
          p.write_text(s)
          PY
          grep -q 'stable-59-unfreeze-main' index.html
          grep -q 'postboot-loader.js?v=32-unfreeze-main' index.html
          grep -q 'isa-main-chat-recovery-v59' index.html
      - name: Commit main recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: unfreeze personal profiles and load extras independently' || exit 0
          git push
