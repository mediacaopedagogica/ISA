name: Refresh profile menu loader v1
on:
  push:
    paths:
      - '.github/workflows/refresh-profile-menu-loader-v1.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh profile menu assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./postboot-loader.js?v=33-progressive-mobile'
          new='./postboot-loader.js?v=34-profile-menus'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('postboot loader marker not found')
          p.write_text(s)
          PY
          grep -q 'postboot-loader.js?v=34-profile-menus' index.html
      - name: Commit refreshed loader
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: refresh profile-specific menus' || exit 0
          git push
