name: Rebuild Cantinho core v34

on:
  push:
    paths:
      - '.github/workflows/fix-v34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build direct core
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @supabase/supabase-js@2 esbuild@0.25.9
          cat > core-v34-entry.js <<'EOF'
          import { createClient } from '@supabase/supabase-js'
          import { CONFIG } from './config.js'
          window.__ISA_SCRIPT_LOADED__ = true;
          async function __isaCore34(){
          window.__ISA_CORE_STARTED__ = true;
          EOF
          cat chunk-00.txt chunk-01.txt chunk-02.txt chunk-03.txt chunk-04.txt chunk-05.txt chunk-06.txt chunk-07.txt chunk-08.txt chunk-09.txt >> core-v34-entry.js
          cat >> core-v34-entry.js <<'EOF'
          }
          __isaCore34().then(()=>{window.__ISA_APP_READY__=true;}).catch(error=>{
            console.error('Falha ao iniciar Cantinho da Isa:',error);
            window.__ISA_APP_ERROR__=String(error?.message||error||'Erro desconhecido');
            const personal=new URLSearchParams(location.search).get('perfil');
            const login=document.getElementById('loginView');
            if(login && !personal) login.classList.remove('hidden');
            const msg=document.getElementById('loginMsg');
            if(msg){msg.textContent='O aplicativo não conseguiu iniciar. Atualize a página.';msg.style.color='#a15472';}
          });
          EOF
          npx esbuild core-v34-entry.js --bundle --format=iife --platform=browser --target=es2020 --outfile=app-v34.js
          node --check app-v34.js
          grep -q 'async function boot' app-v34.js
          grep -q 'await boot()' app-v34.js

      - name: Restore app modules
        run: |
          test -f extras-loader.js
          test -f call-manager.js
          test -f family-media-menu-v2.js
          test -f media-capture.js
          test -f mobile-responsive-v2.js
          test -f notifications-v2.js
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove stale/duplicate loaders, while keeping the direct core.
          s=re.sub(r'<script defer src="\./app-v31\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'<script defer src="\./app-v34\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'<script type="module" src="\./mobile-responsive-v2\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'<script type="module" src="\./notifications-v2\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'<script type="module" src="\./extras-loader\.js\?v=[^"]+"></script>', '', s)
          block='''<script defer src="./app-v34.js?v=direct-48"></script>\n<script type="module" src="./mobile-responsive-v2.js?v=8-restore"></script>\n<script type="module" src="./notifications-v2.js?v=5-restore"></script>\n<script type="module" src="./extras-loader.js?v=9-restore"></script>'''
          marker='<script>\nwindow.addEventListener(\'load\',()=>{'
          if marker not in s:
              raise SystemExit('load marker not found')
          s=s.replace(marker,block+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'extras-loader.js?v=9-restore' index.html
          grep -q 'notifications-v2.js?v=5-restore' index.html
          grep -q 'mobile-responsive-v2.js?v=8-restore' index.html

      - name: Commit restored app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v34.js index.html
          git commit -m 'Restore calls audio notifications and responsive extras' || exit 0
          git push
