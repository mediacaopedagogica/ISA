name: Add Alan private music studio v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-alan-studio-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write Alan studio module
        env:
          ALAN_GZ_B64: 
        run: |
          echo "$ALAN_GZ_B64" | base64 -d | gzip -d > alan-studio.js
          node --check alan-studio.js
      - name: Wire Alan-only loader and cache busts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('extras-loader.js'); s=p.read_text()
          if "function isAlan()" not in s:
              s=s.replace("function isParent(){return who()==='keise'||who()==='alan'}", "function isParent(){return who()==='keise'||who()==='alan'}\nfunction isAlan(){return who()==='alan'}")
          if "loadOnce('alan-studio'" not in s:
              needle="  if(isIsa()){\n    jobs.push(loadOnce('isa-tools','./isa-tools.js?v=9-study-fix'))"
              insert="  if(isAlan())jobs.push(loadOnce('alan-studio','./alan-studio.js?v=1'))\n  if(isIsa()){\n    jobs.push(loadOnce('isa-tools','./isa-tools.js?v=9-study-fix'))"
              s=s.replace(needle,insert)
          p.write_text(s)

          p=Path('postboot-loader.js'); s=p.read_text().replace("./extras-loader.js?v=33-farm-v13","./extras-loader.js?v=34-alan-studio")
          p.write_text(s)

          p=Path('index.html'); s=p.read_text().replace("./postboot-loader.js?v=13-farm-v13","./postboot-loader.js?v=14-alan-studio")
          p.write_text(s)
          PY
          node --check alan-studio.js
          node --check extras-loader.js
          grep -q "function isAlan()" extras-loader.js
          grep -q "alan-studio.js?v=1" extras-loader.js
          grep -q "extras-loader.js?v=34-alan-studio" postboot-loader.js
          grep -q "postboot-loader.js?v=14-alan-studio" index.html
      - name: Commit Alan studio v1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alan-studio.js extras-loader.js postboot-loader.js index.html
          git commit -m 'Add private Alan music studio v1'
          git push
