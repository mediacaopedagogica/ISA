name: Force mobile interaction

on:
  push:
    paths:
      - '.github/workflows/force-mobile-interaction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish dedicated mobile loader versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./mobile-interaction-guard.js?v=2-android-touch','./mobile-interaction-guard.js?v=3-native-skip')
          s=s.replace('./postboot-loader.js?v=6-android-touch','./postboot-loader.js?v=7-native-mobile')
          s=s.replace('./postboot-loader.js?v=5-mobile-interaction','./postboot-loader.js?v=7-native-mobile')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Sanity check
        run: |
          grep -q 'mobile-interaction-guard.js?v=3-native-skip' index.html
          grep -q 'postboot-loader.js?v=7-native-mobile' index.html
          grep -q "dedicatedMobile" postboot-loader.js
          grep -q "mobile-native.js" postboot-loader.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Publish dedicated mobile entry flow'
          git push
