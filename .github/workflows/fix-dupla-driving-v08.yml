name: Fix Dupla driving v0.8
on:
  push:
    paths:
      - '.github/workflows/fix-dupla-driving-v08.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix forward reverse steering and collisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('jogos/dupla-na-pista-teste.html')
          s=p.read_text()
          s=s.replace('pista viva v0.7 • direção livre','pista viva v0.8 • direção realista + ré')
          s=s.replace('🧪 TESTE JOGO • KEISE • v0.7','🧪 TESTE JOGO • KEISE • v0.8')
          s=s.replace("<div class=\"speedMeta\"><span id=\"fuelMini\">⛽78%</span><span id=\"turboMini\">⚡72%</span></div>","<div class=\"speedMeta\"><span id=\"fuelMini\">⛽78%</span><span id=\"gearHud\">N</span><span id=\"turboMini\">⚡72%</span></div>")
          s=s.replace("$('speedHud').textContent=Math.round(s.speed*3.6);","$('speedHud').textContent=Math.round(Math.abs(s.speed)*3.6);$('gearHud').textContent=s.speed<-.25?'R':s.speed>.25?'D':'N';")
          s=s.replace('↓ freia','↓ freia / segure para ré')
          s=s.replace('latVel:0})','latVel:0,collisionCooldown:0})')

          anchor='function nearestRoadState(s,track)'
          idx=s.find(anchor)
          assert idx!=-1, 'nearestRoadState não encontrado'
          helper="""function carAxes(s){const f={x:Math.sin(s.yaw),z:-Math.cos(s.yaw)},r={x:Math.cos(s.yaw),z:Math.sin(s.yaw)};return{f,r}}function obbCollision(ai,bi){const a=states[ai],b=states[bi];if(![a.x,a.z,b.x,b.z].every(Number.isFinite))return null;const dx=b.x-a.x,dz=b.z-a.z;if(dx*dx+dz*dz>64)return null;const aa=carAxes(a),bb=carAxes(b),axes=[aa.f,aa.r,bb.f,bb.r],HL=2.55,HW=1.08;let min=Infinity,nx=0,nz=0;for(const ax of axes){const len=Math.hypot(ax.x,ax.z)||1,ux=ax.x/len,uz=ax.z/len,ra=HL*Math.abs(aa.f.x*ux+aa.f.z*uz)+HW*Math.abs(aa.r.x*ux+aa.r.z*uz),rb=HL*Math.abs(bb.f.x*ux+bb.f.z*uz)+HW*Math.abs(bb.r.x*ux+bb.r.z*uz),proj=dx*ux+dz*uz,ov=ra+rb-Math.abs(proj);if(ov<=0)return null;if(ov<min){min=ov;const sg=proj>=0?1:-1;nx=ux*sg;nz=uz*sg}}return{depth:min,nx,nz}}function resolveVehicleCollision(ai,bi){const hit=obbCollision(ai,bi);if(!hit)return false;const a=states[ai],b=states[bi],push=hit.depth+.08;a.x-=hit.nx*push*.72;a.z-=hit.nz*push*.72;b.x+=hit.nx*push*.28;b.z+=hit.nz*push*.28;a.speed*=.18;b.speed*=.55;a.impact=Math.max(a.impact||0,1.35);b.impact=Math.max(b.impact||0,.8);if((a.collisionCooldown||0)<=0){a.motor=Math.max(45,a.motor-.35);a.susp=Math.max(45,a.susp-.55);a.collisionCooldown=.9;msg('💥 Colisão — os carros não atravessam um ao outro')}return true}"""
          s=s[:idx]+helper+s[idx:]

          pat=r"if\(acc\)s\.speed=Math\.min\(44,s\.speed\+11\.8\*dt\);else s\.speed=Math\.max\(0,s\.speed-3\.1\*dt\);if\(brake\)s\.speed=Math\.max\(0,s\.speed-19\.5\*dt\);const steerInput=.*?const offRoad=Math\.abs\(s\.lat\)>4\.3;"
          m=re.search(pat,s,re.S)
          assert m, 'bloco de direção v0.7 não encontrado'
          repl="""s.collisionCooldown=Math.max(0,(s.collisionCooldown||0)-dt);if(acc){if(s.speed<-.15)s.speed=Math.min(0,s.speed+18*dt);else s.speed=Math.min(44,s.speed+10.5*dt)}else if(brake){if(s.speed>.35)s.speed=Math.max(0,s.speed-22*dt);else s.speed=Math.max(-9,s.speed-7.2*dt)}else{if(s.speed>0)s.speed=Math.max(0,s.speed-2.3*dt);else if(s.speed<0)s.speed=Math.min(0,s.speed+2.8*dt)}const steerInput=(right?1:0)-(left?1:0),speedAbs=Math.abs(s.speed),speedFactor=THREE.MathUtils.clamp(speedAbs/32,0,1),maxSteer=THREE.MathUtils.degToRad(30-24*speedFactor),targetSteer=steerInput*maxSteer;s.steerAngle=THREE.MathUtils.lerp(s.steerAngle,targetSteer,Math.min(1,dt*(steerInput?4.8:10.5)));s.steer=s.steerAngle/Math.max(maxSteer,.001);const wheelBase=3.15,rawYaw=Math.abs(s.speed)>.08?(s.speed/wheelBase)*Math.tan(s.steerAngle):0,maxLatAccel=4.8+1.6*(s.tires/100),yawLimit=maxLatAccel/Math.max(speedAbs,2.5),yawRate=THREE.MathUtils.clamp(rawYaw,-yawLimit,yawLimit);s.yaw+=yawRate*dt;const forwardX=Math.sin(s.yaw),forwardZ=-Math.cos(s.yaw),oldT=s.t;s.x+=forwardX*s.speed*dt;s.z+=forwardZ*s.speed*dt;resolveVehicleCollision(active,1-active);let near=nearestRoadState(s,tracks[active]);s.t=near.t;s.lat=near.lat;const inService=s.t>SERVICE_T0-.02&&s.t<SERVICE_T1+.02,serviceOut=serviceSide(),laneLimit=(inService&&s.lat*serviceOut>0)?8.65:5.0;if(Math.abs(s.lat)>laneLimit){const over=Math.abs(s.lat)-laneLimit+.04,sg=Math.sign(s.lat)||1;s.x-=near.f.side.x*sg*over;s.z-=near.f.side.z*sg*over;s.speed*=.38;s.impact=Math.max(s.impact||0,1);s.susp=Math.max(45,s.susp-.25);near=nearestRoadState(s,tracks[active]);s.t=near.t;s.lat=near.lat;if((s.collisionCooldown||0)<=0){s.collisionCooldown=.65;msg('⚠️ Guard-rail — reduza a velocidade')}}let routeDelta=s.t-oldT;if(routeDelta<-.5)routeDelta+=1;if(routeDelta>.5)routeDelta-=1;const delta=Math.max(0,routeDelta);const offRoad=Math.abs(s.lat)>4.0;"""
          s=s[:m.start()]+repl+s[m.end():]

          s=s.replace("const slip=Math.abs(s.steerAngle)*speedFactor*.7;","const slip=Math.abs(s.steerAngle)*speedFactor*.55;")
          s=s.replace("s.bodyRoll=THREE.MathUtils.lerp(s.bodyRoll,-s.steer*speedFactor*.045,Math.min(1,dt*7));","s.bodyRoll=THREE.MathUtils.lerp(s.bodyRoll,-s.steer*speedFactor*.032,Math.min(1,dt*8));")
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('jogos/dupla-na-pista-teste.html').read_text()
          assert 'pista viva v0.8 • direção realista + ré' in s
          assert "s.speed=Math.max(-9" in s
          assert 'resolveVehicleCollision(active,1-active)' in s
          assert "gearHud" in s
          m=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/dupla.mjs').write_text(m[-1])
          PY
          node --check /tmp/dupla.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          git commit -m 'fix: natural forward reverse steering and solid car collision'
          git push
