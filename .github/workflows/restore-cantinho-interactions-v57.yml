name: Restore Cantinho interactions v57
on:
  push:
    paths:
      - '.github/workflows/restore-cantinho-interactions-v57.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable interaction core
        shell: bash
        run: |
          set -euo pipefail
          BASE=b90953dfb693b96f30b9c1f622d4d5a14835093c
          git show "$BASE:app-v33.js" > app-v33.js
          git show "$BASE:index.html" > index.html

          cat > interaction-emergency.js <<'JS'
          (()=>{
            let leaving=false
            const clearSession=()=>{
              for(const store of [localStorage,sessionStorage]){
                const doomed=[]
                for(let i=0;i<store.length;i++){
                  const key=store.key(i)||''
                  if((key.startsWith('sb-')&&key.endsWith('-auth-token'))||key.startsWith('isa:personal-access:'))doomed.push(key)
                }
                doomed.forEach(key=>{try{store.removeItem(key)}catch{}})
              }
            }
            const hardLogout=()=>{
              if(leaving)return
              leaving=true
              const btn=document.getElementById('logoutBtn')
              if(btn){btn.disabled=true;btn.textContent='Saindo…'}
              clearSession()
              const u=new URL('./',location.href)
              u.search=''
              u.searchParams.set('logout','1')
              u.searchParams.set('_cb',String(Date.now()))
              u.hash=''
              location.replace(u.href)
            }
            document.addEventListener('click',event=>{
              if(event.target.closest?.('#logoutBtn')){
                event.preventDefault()
                event.stopImmediatePropagation()
                hardLogout()
              }
            },true)
            document.addEventListener('keydown',event=>{
              if((event.key==='Enter'||event.key===' ')&&event.target.closest?.('#logoutBtn')){
                event.preventDefault()
                event.stopImmediatePropagation()
                hardLogout()
              }
            },true)
            window.__ISA_HARD_LOGOUT__=hardLogout
          })()
          JS

          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace("./sw.js?v=restore-39","./sw.js?v=restore-40-interactions")
          s=s.replace('<script defer src="./mobile-interaction-guard.js?v=4-early"></script>', '<script defer src="./interaction-emergency.js?v=1-interactions"></script>\n<script defer src="./mobile-interaction-guard.js?v=6-native-clicks"></script>')
          s=s.replace('./app-v33.js?v=stable-52-avatar','./app-v33.js?v=stable-54-interactions')
          s=s.replace('./postboot-loader.js?v=23-access-and-dupla-fix','./postboot-loader.js?v=24-interactions')
          p.write_text(s)

          p=Path('mobile-interaction-guard.js')
          s=p.read_text()
          s=s.replace('let suppressTrustedClickUntil=0\n','')
          old="""document.addEventListener('click',event=>{
  if(Date.now()<suppressTrustedClickUntil&&event.isTrusted){event.preventDefault();event.stopImmediatePropagation();return}
  syncAfterClick(event)
},true)

document.addEventListener('touchend',event=>{
  if(!mobileMQ.matches||!mobileReady())return
  const action=event.target.closest?.('#mainView button,#mainView [role=\"button\"]')
  if(!action||action.disabled)return
  event.preventDefault()
  suppressTrustedClickUntil=Date.now()+650
  action.click()
},{capture:true,passive:false})
"""
          new="""document.addEventListener('click',event=>{
  syncAfterClick(event)
},true)
"""
          if old not in s:
              raise SystemExit('mobile synthetic-click block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check app-v33.js
          node --check interaction-emergency.js
          node --check mobile-interaction-guard.js
          grep -q 'stable-54-interactions' index.html
          grep -q 'v=6-native-clicks' index.html
          grep -q '__ISA_HARD_LOGOUT__' interaction-emergency.js
          grep -q 'document.querySelectorAll("\[data-conv\]")' app-v33.js
          if grep -q 'suppressTrustedClickUntil' mobile-interaction-guard.js; then
            echo 'Synthetic click suppression still present'
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v33.js mobile-interaction-guard.js interaction-emergency.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: restore chat, logout and native mobile interactions'
          git push
