name: Fix Dupla raycast vehicle physics v1.0
on:
  push:
    paths:
      - '.github/workflows/fix-dupla-raycast-v10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch raycast vehicle physics
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/fix_dupla_v10.py
          python /tmp/fix_dupla_v10.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('jogos/dupla-na-pista-teste.html').read_text()
          assert 'pista viva v1.0 • suspensão + pneus raycast' in s
          assert 'new CANNON.RaycastVehicle' in s
          mods=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          assert mods
          Path('/tmp/dupla.mjs').write_text(mods[-1])
          PY
          node --check /tmp/dupla.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          git commit -m 'fix: raycast suspension tire grip and solid guardrails'
          git push
