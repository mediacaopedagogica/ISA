name: Publish Dupla na Pista v0.5
on:
  push:
    paths:
      - '.github/workflows/publish-dupla-v05.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish realistic track v0.5
        shell: bash
        run: |
          cat .build/dupla-v05/part1.txt \
              .build/dupla-v05/part2.txt \
              .build/dupla-v05/part3.txt \
              .build/dupla-v05/part4.txt \
              .build/dupla-v05/part5.txt \
              .build/dupla-v05/part6.txt \
              .build/dupla-v05/part7.txt | base64 -d | gzip -d > jogos/dupla-na-pista-teste.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('jogos/dupla-na-pista-teste.html').read_text()
          assert 'pista viva v0.5' in s
          m=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/dupla.mjs').write_text(m[-1])
          PY
          node --check /tmp/dupla.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: realistic steering start grid mountains and roadside life'
          git push
