name: Upgrade Fazendinha realism v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-farm-realism-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch source
        run: python tools/upgrade_farm_v13.py
      - name: Bundle v13
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/fazendinha-experience-v6.js')
          s=p.read_text()
          repl={
            "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'":"import * as THREE from 'three'",
            "import { Sky } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/objects/Sky.js'":"import { Sky } from 'three/addons/objects/Sky.js'",
            "import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js'":"import { OrbitControls } from 'three/addons/controls/OrbitControls.js'",
            "import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js'":"import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'",
            "import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/RGBELoader.js'":"import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'",
            "import * as SkeletonUtils from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/SkeletonUtils.js'":"import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'",
            "import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/RoundedBoxGeometry.js'":"import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'",
          }
          for a,b in repl.items():
              if a not in s: raise SystemExit(f'missing import {a}')
              s=s.replace(a,b)
          Path('jogos/.fazendinha-entry-v13.js').write_text(s)
          PY
          npm install --no-save three@0.180.0 esbuild@0.25.9
          npx esbuild jogos/.fazendinha-entry-v13.js --bundle --format=iife --target=es2020 --outfile=jogos/fazendinha-bundle-v13.js --log-level=info
          node --check jogos/fazendinha-bundle-v13.js
          rm -f jogos/.fazendinha-entry-v13.js package-lock.json
          rm -rf node_modules
      - name: Update cache chain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('jogos/fazendinha-multiplayer.html');x=h.read_text();x=re.sub(r'fazendinha-experience-v6\.css\?v=[^\"\']+','fazendinha-experience-v6.css?v=13-stable-roofs',x);x=re.sub(r'fazendinha-bundle-v\d+\.js\?v=[^\"\']+','fazendinha-bundle-v13.js?v=13-stable-roofs',x);h.write_text(x)
          g=Path('games-menu-farm.js');x=g.read_text();x=re.sub(r'fazendinha-multiplayer\.html\?v=[^&`\"\']+','fazendinha-multiplayer.html?v=13-stable-roofs',x);g.write_text(x)
          e=Path('extras-loader.js');x=e.read_text();x=re.sub(r'games-menu-farm\.js\?v=[^\'\"]+','games-menu-farm.js?v=13-stable-roofs',x);e.write_text(x)
          p=Path('postboot-loader.js');x=p.read_text();x=re.sub(r'extras-loader\.js\?v=[^\'\"]+','extras-loader.js?v=33-farm-v13',x);p.write_text(x)
          i=Path('index.html');x=i.read_text();x=re.sub(r'postboot-loader\.js\?v=[^\'\"]+','postboot-loader.js?v=13-farm-v13',x);i.write_text(x)
          PY
          grep -q 'fazendinha-bundle-v13.js?v=13-stable-roofs' jogos/fazendinha-multiplayer.html
      - name: Commit generated v13
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/fazendinha-experience-v6.js jogos/fazendinha-bundle-v13.js jogos/fazendinha-multiplayer.html games-menu-farm.js extras-loader.js postboot-loader.js index.html
          git commit -m 'Fix Fazendinha roofs lighting grass and animal realism v13'
          git push
