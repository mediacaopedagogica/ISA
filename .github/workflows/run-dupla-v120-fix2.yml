name: Run Dupla v1.2.0 audited rebuild 2
on:
  push:
    paths:
      - '.github/workflows/run-dupla-v120-fix2.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild audited driving core
        run: python scripts/rebuild_dupla_v120.py
      - name: Commit rebuilt game
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: rebuild Dupla driving core v1.2.0'
          git push
