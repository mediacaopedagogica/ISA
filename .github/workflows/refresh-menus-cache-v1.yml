name: Refresh menus cache v1
on:
  push:
    paths:
      - '.github/workflows/refresh-menus-cache-v1.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh menu module versions
        run: |
          python - <<'PY'
          from pathlib import Path
          def swap(path, old, new):
              p=Path(path); s=p.read_text()
              if old in s:
                  s=s.replace(old,new)
                  p.write_text(s)
              elif new not in s:
                  raise SystemExit(f'{path}: marker not found: {old}')
          swap('index.html','./postboot-loader.js?v=34-profile-menus','./postboot-loader.js?v=35-stable-games')
          swap('postboot-loader.js','./profile-menu-guard.js?v=2-all-family-features','./profile-menu-guard.js?v=3-stable-games')
          for path in ['acesso-mobile.html','acesso.html']:
              swap(path,'./external-menu.js?v=2-all-family-features','./external-menu.js?v=3-games-studies')
              swap(path,'./games-menu.js?v=10-all-family-features','./games-menu.js?v=11-all-family-menu')
              swap(path,'./paloma-studies.js?v=7-all-family-features','./paloma-studies.js?v=8-paloma-menu')
          PY
          node --check postboot-loader.js
          node --check profile-menu-guard.js
          node --check external-menu.js
      - name: Commit refreshed versions
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html postboot-loader.js acesso-mobile.html acesso.html
          git commit -m 'fix: refresh stable menus on mobile and notebook'
          git push
