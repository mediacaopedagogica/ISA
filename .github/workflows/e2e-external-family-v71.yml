name: E2E external family v71
on:
  push:
    paths:
      - '.github/workflows/e2e-external-family-v71.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
      - name: Test real external family flow in Chromium
        shell: bash
        run: |
          cat > ./e2e-external.mjs <<'JS'
          import { chromium } from 'playwright';
          const people=['vania','paloma','davi','evalda','elion','silvane'];
          const browser=await chromium.launch({headless:true});
          let failures=0;
          for(const person of people){
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const logs=[];
            page.on('console',m=>{if(['error','warning'].includes(m.type()))logs.push(`${m.type()}: ${m.text()}`)});
            page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
            page.on('requestfailed',r=>logs.push(`requestfailed: ${r.url()} :: ${r.failure()?.errorText||''}`));
            const file=person==='elion'?'acesso.html':'acesso-mobile.html';
            const url=`https://mediacaopedagogica.github.io/ISA/${file}?e2e=${Date.now()}#acesso=${person}`;
            console.log(`\n=== ${person.toUpperCase()} ===`);
            try{
              const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              console.log('HTTP',resp?.status());
              await page.waitForTimeout(1500);
              console.log('gate@1.5s',await page.locator('#friendGateTitle').textContent().catch(()=>null),'state',await page.evaluate(()=>window.__ISA_FRIEND_BOOTSTRAP_STATE__||null));
              await page.waitForSelector('#friendEnterBtn:not(.hidden)',{timeout:14000});
              console.log('gate ready',await page.locator('#friendGateTitle').textContent(),'state',await page.evaluate(()=>window.__ISA_FRIEND_BOOTSTRAP_STATE__||null));
              await page.locator('#friendEnterBtn').click();
              await page.waitForSelector('#friendChat:not(.hidden)',{timeout:8000});
              console.log('portal entered',await page.evaluate(()=>({entered:window.__ISA_FRIEND_PORTAL_ENTERED__===true,name:window.__ISA_FRIEND_PERSON__?.name||null})));
              await page.waitForTimeout(1200);
              await page.locator('#friendSocialBtn').click();
              await page.waitForSelector('#familySocialOverlay:not(.hidden)',{timeout:8000});
              await page.waitForTimeout(1000);
              const social=await page.evaluate(()=>({loading:document.getElementById('fsLoading')?.textContent||'',loadingHidden:document.getElementById('fsLoading')?.classList.contains('hidden'),shellHidden:document.getElementById('fsShell')?.classList.contains('hidden')}));
              console.log('social',social);
              if(!social.loadingHidden && social.shellHidden){
                await page.waitForTimeout(9500);
                const social2=await page.evaluate(()=>({loading:document.getElementById('fsLoading')?.textContent||'',loadingHidden:document.getElementById('fsLoading')?.classList.contains('hidden'),shellHidden:document.getElementById('fsShell')?.classList.contains('hidden')}));
                console.log('social@10.5s',social2);
                if(!social2.loadingHidden || social2.shellHidden)throw new Error('Nossa Rede não terminou de abrir');
              }
              console.log('PASS',person);
            }catch(e){
              failures++;
              console.log('FAIL',person,e.message);
              console.log('state',await page.evaluate(()=>({title:document.getElementById('friendGateTitle')?.textContent||null,text:document.getElementById('friendGateText')?.textContent||null,error:document.getElementById('friendGateError')?.textContent||null,boot:window.__ISA_FRIEND_BOOTSTRAP_STATE__||null,valid:window.__ISA_FRIEND_ACCESS_VALID__??null,entered:window.__ISA_FRIEND_PORTAL_ENTERED__??null,social:document.getElementById('fsLoading')?.textContent||null})).catch(()=>null));
              await page.screenshot({path:`/tmp/${person}.png`,fullPage:true}).catch(()=>{});
            }
            if(logs.length)console.log('browser logs\n'+logs.slice(-30).join('\n'));
            await page.close();
          }
          await browser.close();
          if(failures)process.exit(1);
          JS
          node ./e2e-external.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-family-e2e-failures
          path: /tmp/*.png
          if-no-files-found: ignore
