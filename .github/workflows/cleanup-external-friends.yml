name: Cleanup external friend feature

on:
  push:
    paths:
      - '.github/workflows/cleanup-external-friends.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-friend core sources
        run: |
          PRE=dbd41830bed9a6c903586368c87da9408fcfb1b7
          for f in chunk-01.txt chunk-04.txt chunk-07.txt chunk-09.txt heart-polish.css; do
            git show "$PRE:$f" > "$f"
          done
      - name: Remove external-friend files
        run: |
          rm -f amiga.html amiga.css amiga.js app-v35.js
          rm -f scripts/patch_v35.py .github/workflows/fix-v35.yml
      - name: Validate stable family app
        run: |
          node --check app-v34.js
          ! grep -qE 'external_friend|loadExternalFriendAccesses|amiga\.html|friend_portal' chunk-01.txt chunk-04.txt chunk-07.txt chunk-09.txt heart-polish.css index.html
          grep -q 'app-v34.js' index.html
      - name: Remove one-time cleanup workflow
        run: rm -f .github/workflows/cleanup-external-friends.yml
      - name: Commit clean family-only source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove external friend feature completely'
          git push
