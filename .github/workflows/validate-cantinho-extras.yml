name: Validar módulos do Cantinho

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v33.js'
      - 'postboot-loader.js'
      - 'mobile-stability-fix.css'
      - 'extras-loader.js'
      - 'mobile-responsive-v2.js'
      - 'mobile-responsive-v2.css'
      - 'notifications-v2.js'
      - 'group-controls.js'
      - 'profile-mascot.js'
      - 'conversation-pins.js'
      - 'diario.html'
      - 'diario.js'
      - 'diario-cover-logic.js'
      - 'diario-inner-v3.js'
      - 'diario-inner-v3.css'
      - 'isa-tools.js'
      - 'diary-parent.js'
      - 'paused-friends-filter.js'
      - 'family-media-menu-v2.js'
      - 'calendar-alarm.js'
      - 'media-capture.js'
      - 'link-preview.js'
      - 'call-manager.js'
      - 'app-3d.css'
      - 'heart-polish.css'
      - '.github/workflows/validate-cantinho-extras.yml'
  workflow_dispatch:

jobs:
  syntax-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxe JavaScript
        run: |
          node --check app-v33.js
          node --check postboot-loader.js
          node --check extras-loader.js
          node --check mobile-responsive-v2.js
          node --check notifications-v2.js
          node --check group-controls.js
          node --check profile-mascot.js
          node --check conversation-pins.js
          node --check diario.js
          node --check diario-cover-logic.js
          node --check diario-inner-v3.js
          node --check isa-tools.js
          node --check diary-parent.js
          node --check paused-friends-filter.js
          node --check family-media-menu-v2.js
          node --check calendar-alarm.js
          node --check media-capture.js
          node --check link-preview.js
          node --check call-manager.js

      - name: Proteger recursos aprovados
        run: |
          grep -q 'app-v33.js' index.html
          grep -q 'postboot-loader.js' index.html
          grep -q 'mobile-stability-fix.css' index.html
          grep -q 'mobile-responsive-v2.js' postboot-loader.js
          grep -q 'notifications-v2.js' postboot-loader.js
          grep -q 'extras-loader.js' postboot-loader.js

          grep -q 'profile-mascot.js' extras-loader.js
          grep -q 'Escolha uma foto ou um mascote' profile-mascot.js
          grep -q 'profileAvatarInput' profile-mascot.js

          grep -q 'conversation-pins.js' extras-loader.js
          grep -q "marker==='heart'?'💜':'⭐'" conversation-pins.js
          grep -q 'conversation_pins' conversation-pins.js

          grep -q 'family-media-menu-v2.js' extras-loader.js
          grep -q 'recordAudio' family-media-menu-v2.js
          grep -q 'Gravar áudio' family-media-menu-v2.js
          grep -q 'call-manager.js' extras-loader.js
          grep -q 'RTCPeerConnection' call-manager.js
          grep -q 'Chamada de voz' call-manager.js
          grep -q 'Videochamada' call-manager.js

          grep -q 'studyNav' isa-tools.js
          grep -q 'diaryNav' isa-tools.js
          grep -q "who()==='isa'" mobile-responsive-v2.js
          grep -q "who()==='keise'||who()==='alan'" mobile-responsive-v2.js
          grep -q 'grid-template-columns:repeat(4' mobile-responsive-v2.css

          grep -q 'diario-inner-v3.css' diario.html
          grep -q 'diario-inner-v3.js' diario.html
          grep -q 'Meu Diário' diario.html
          grep -q 'Post-its' diario.html

          test -s app-3d.css
          test -s heart-polish.css
