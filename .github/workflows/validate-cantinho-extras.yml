name: Validar módulos do Cantinho

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v34.js'
      - 'keise-approved-layout-final.js'
      - 'final-shell-bootstrap-v3.js'
      - 'personal-boot-failopen-v1.js'
      - 'postboot-loader.js'
      - 'mobile-stability-fix.css'
      - 'extras-loader.js'
      - 'mobile-responsive-v2.js'
      - 'mobile-responsive-v2.css'
      - 'notifications-v2.js'
      - 'group-controls.js'
      - 'profile-mascot.js'
      - 'conversation-pins.js'
      - 'diario.html'
      - 'diario.js'
      - 'diario-cover-logic.js'
      - 'diario-inner-v3.js'
      - 'diario-inner-v3.css'
      - 'isa-tools.js'
      - 'diary-parent.js'
      - 'paused-friends-filter.js'
      - 'family-media-menu-v2.js'
      - 'calendar-alarm.js'
      - 'media-capture.js'
      - 'link-preview.js'
      - 'call-manager.js'
      - 'games-notebook-fit.js'
      - 'games-menu-snake.js'
      - 'jogos/cobrinha-pastel.html'
      - 'app-3d.css'
      - 'heart-polish.css'
      - 'acesso.html'
      - 'acesso-mobile.html'
      - 'paloma-studies.js'
      - 'paloma-studies.css'
      - 'paloma-studies-advanced.js'
      - 'paloma-studies-advanced-mobile.js'
      - 'paloma-studies-advanced.css'
      - 'paloma-study-desk.js'
      - 'paloma-study-desk.css'
      - '.github/workflows/validate-cantinho-extras.yml'
  workflow_dispatch:

jobs:
  syntax-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxe JavaScript
        run: |
          node --check app-v34.js
          node --check keise-approved-layout-final.js
          node --check final-shell-bootstrap-v3.js
          node --check personal-boot-failopen-v1.js
          node --check postboot-loader.js
          node --check extras-loader.js
          node --check mobile-responsive-v2.js
          node --check notifications-v2.js
          node --check group-controls.js
          node --check profile-mascot.js
          node --check conversation-pins.js
          node --check diario.js
          node --check diario-cover-logic.js
          node --check diario-inner-v3.js
          node --check isa-tools.js
          node --check diary-parent.js
          node --check paused-friends-filter.js
          node --check family-media-menu-v2.js
          node --check calendar-alarm.js
          node --check media-capture.js
          node --check link-preview.js
          node --check call-manager.js
          node --check games-notebook-fit.js
          node --check games-menu-snake.js
          node --check paloma-studies.js
          node --check paloma-studies-advanced.js
          node --check paloma-studies-advanced-mobile.js
          node --check paloma-study-desk.js

      - name: Proteger núcleo único, recursos pausados e funções preservadas
        run: |
          grep -q 'app-v34.js?v=20260919-egress-cache-v2-single-boot' index.html
          ! grep -q '<script src="./app-v33.js' index.html
          grep -q 'keise-approved-layout-final.js?v=10-feature-pause' index.html
          grep -q 'postboot-loader.js?v=87-egress-safe' index.html
          grep -q '__ISA_APP_READY__' keise-approved-layout-final.js
          grep -q 'SOCIAL_DISABLED=true' keise-approved-layout-final.js
          grep -q 'TEST_DISABLED=true' keise-approved-layout-final.js
          ! grep -q 'session ? boot()' app-v34.js
          grep -q '}, 3e4);' app-v34.js

          grep -q 'profile-mascot.js' extras-loader.js
          grep -q 'conversation-pins.js' extras-loader.js
          grep -q 'games-menu.js' extras-loader.js
          grep -q 'games-menu-snake.js' extras-loader.js
          ! grep -q "jobs.push(loadOnce('keise-game-test'" extras-loader.js
          grep -q "if(!TEST_GAME_DISABLED)jobs.push(loadOnce('keise-game-test'" extras-loader.js

          grep -q 'family-media-menu-v2.js?v=14-no-audio-poll-loop' postboot-loader.js
          grep -q 'timelineChanged' family-media-menu-v2.js
          ! grep -q '},3000)' family-media-menu-v2.js
          grep -q 'recordAudio' family-media-menu-v2.js
          grep -q 'Gravar áudio' family-media-menu-v2.js

          grep -q 'STUDIES_DISABLED=true' external-menu.js
          grep -q 'PALOMA_STUDIES_DISABLED=true' external-progressive-loader.js
          grep -q "if(!PALOMA_STUDIES_DISABLED&&name.includes('paloma'))" external-progressive-loader.js
          ! grep -q 'paloma-studies.css' acesso.html
          ! grep -q 'paloma-studies.css' acesso-mobile.html
          ! grep -q 'id="friendSocialBtn"' acesso.html
          ! grep -q 'id="friendSocialBtn"' acesso-mobile.html
          grep -q 'pausedFeaturesGuard' acesso.html
          grep -q 'pausedFeaturesGuard' acesso-mobile.html

          # Recursos pausados continuam preservados no repositório para reativação futura.
          test -s keise-game-test.js
          test -s social-network-stable-v9.js
          test -s paloma-studies.js
          test -s paloma-studies-advanced.js
          test -s paloma-study-desk.js

          # Recursos que continuam ativos permanecem disponíveis.
          test -s games-menu.js
          test -s games-menu-snake.js
          test -s jogos/cobrinha-pastel.html
          test -s app-3d.css
          test -s heart-polish.css
