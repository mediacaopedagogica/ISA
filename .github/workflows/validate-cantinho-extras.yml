name: Validar módulos do Cantinho

on:
  push:
    branches: [main]
    paths:
      - 'extras-loader.js'
      - 'mobile-responsive-v1.js'
      - 'mobile-responsive-v1.css'
      - 'group-controls.js'
      - 'profile-mascot.js'
      - 'diario.js'
      - 'diario-cover-logic.js'
      - 'isa-tools.js'
      - 'diary-parent.js'
      - 'paused-friends-filter.js'
      - 'family-media-menu.js'
      - 'family-media-menu-v2.js'
      - 'calendar-alarm.js'
      - 'amiga.js'
      - 'amiga-ui-enhanced.js'
      - 'external-access-controls.js'
      - 'media-capture.js'
      - 'native-media-bridge.js'
      - 'link-preview.js'
      - 'call-manager.js'
      - '.github/workflows/validate-cantinho-extras.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe JavaScript
        run: |
          node --check extras-loader.js
          node --check mobile-responsive-v1.js
          node --check group-controls.js
          node --check profile-mascot.js
          node --check diario.js
          node --check diario-cover-logic.js
          node --check isa-tools.js
          node --check diary-parent.js
          node --check paused-friends-filter.js
          node --check family-media-menu.js
          node --check family-media-menu-v2.js
          node --check calendar-alarm.js
          node --check amiga.js
          node --check amiga-ui-enhanced.js
          node --check external-access-controls.js
          node --check media-capture.js
          node --check native-media-bridge.js
          node --check link-preview.js
          node --check call-manager.js