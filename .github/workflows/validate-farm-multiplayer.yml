name: Validar Fazendinha Multiplayer

on:
  push:
    branches: [main]
    paths:
      - 'jogos/fazendinha-multiplayer.html'
      - 'jogos/fazendinha-multiplayer.css'
      - 'jogos/fazendinha-experience-v6.css'
      - 'jogos/fazendinha-experience-v6.js'
      - 'games-menu-farm.js'
      - 'keise-game-test.js'
      - 'extras-loader.js'
      - 'postboot-loader.js'
      - 'index.html'
      - 'acesso.html'
      - 'acesso-mobile.html'
      - '.github/workflows/validate-farm-multiplayer.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe
        run: |
          node --check jogos/fazendinha-experience-v6.js
          node --check games-menu-farm.js
          node --check keise-game-test.js
          node --check extras-loader.js
          node --check postboot-loader.js
      - name: Verificar integração
        run: |
          test -s jogos/fazendinha-multiplayer.html
          test -s jogos/fazendinha-multiplayer.css
          test -s jogos/fazendinha-experience-v6.css
          test -s jogos/fazendinha-experience-v6.js
          grep -q 'Fazendinha Família Feliz' jogos/fazendinha-multiplayer.html
          grep -q 'camera360Btn' jogos/fazendinha-multiplayer.html
          grep -q 'eyeCameraBtn' jogos/fazendinha-multiplayer.html
          grep -q 'data-tool="fish"' jogos/fazendinha-multiplayer.html
          grep -q 'GLTFLoader' jogos/fazendinha-experience-v6.js
          grep -q 'farm_game_bootstrap' jogos/fazendinha-experience-v6.js
          grep -q 'farm_game_snapshot' jogos/fazendinha-experience-v6.js
          grep -q 'farm_game_action' jogos/fazendinha-experience-v6.js
          grep -q 'não aparece no menu da Isa' games-menu-farm.js
          ! grep -q "loadOnce('farm-game'" extras-loader.js
          grep -q "data-game=\"farm\"" keise-game-test.js
          grep -q 'fazendinha-multiplayer.html' keise-game-test.js
          grep -q "name()!=='keise'" keise-game-test.js
          ! grep -q 'games-menu-farm.js' acesso.html
          ! grep -q 'games-menu-farm.js' acesso-mobile.html
