name: Validar Fazendinha Multiplayer

on:
  push:
    branches: [main]
    paths:
      - 'jogos/fazendinha-multiplayer.html'
      - 'jogos/fazendinha-multiplayer.css'
      - 'jogos/fazendinha-multiplayer.js'
      - 'games-menu-farm.js'
      - 'extras-loader.js'
      - 'postboot-loader.js'
      - 'acesso.html'
      - 'acesso-mobile.html'
      - '.github/workflows/validate-farm-multiplayer.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe
        run: |
          node --check jogos/fazendinha-multiplayer.js
          node --check games-menu-farm.js
          node --check extras-loader.js
          node --check postboot-loader.js
      - name: Verificar integração
        run: |
          test -s jogos/fazendinha-multiplayer.html
          test -s jogos/fazendinha-multiplayer.css
          test -s jogos/fazendinha-multiplayer.js
          test -s games-menu-farm.js
          grep -q 'Fazendinha Família Feliz' jogos/fazendinha-multiplayer.html
          grep -q 'v=4-realismo-movimento' jogos/fazendinha-multiplayer.html
          grep -q 'teste exclusivo da Isa' jogos/fazendinha-multiplayer.html
          grep -q 'Editar Nick' jogos/fazendinha-multiplayer.html
          grep -q 'farm_game_bootstrap' jogos/fazendinha-multiplayer.js
          grep -q 'farm_game_snapshot' jogos/fazendinha-multiplayer.js
          grep -q 'farm_game_action' jogos/fazendinha-multiplayer.js
          grep -q 'function moveLocal' jogos/fazendinha-multiplayer.js
          grep -q 'function queueMove' jogos/fazendinha-multiplayer.js
          grep -q 'function groundTarget' jogos/fazendinha-multiplayer.js
          grep -q 'function spawnParticle' jogos/fazendinha-multiplayer.js
          grep -q 'function addHouse' jogos/fazendinha-multiplayer.js
          grep -q 'function addBarn' jogos/fazendinha-multiplayer.js
          grep -q 'function addSilo' jogos/fazendinha-multiplayer.js
          grep -q 'function addWindmill' jogos/fazendinha-multiplayer.js
          grep -q "addAnimal('pig-a'" jogos/fazendinha-multiplayer.js
          grep -q "addAnimal('sheep-a'" jogos/fazendinha-multiplayer.js
          grep -q "addAnimal('horse-a'" jogos/fazendinha-multiplayer.js
          grep -q "addAnimal('dog-a'" jogos/fazendinha-multiplayer.js
          grep -q "function eligible(){return currentName()==='isa'}" games-menu-farm.js
          grep -q 'v=4-realismo-movimento' games-menu-farm.js
          grep -q "loadOnce('farm-game','./games-menu-farm.js?v=4-realismo-movimento')" extras-loader.js
          ! grep -q 'games-menu-farm.js' acesso.html
          ! grep -q 'games-menu-farm.js' acesso-mobile.html
          ! grep -q 'Isa no notebook e Primo no celular' games-menu-farm.js
