name: Validar Fazendinha Multiplayer

on:
  push:
    branches: [main]
    paths:
      - 'jogos/fazendinha-multiplayer.html'
      - 'jogos/fazendinha-multiplayer.css'
      - 'jogos/fazendinha-experience-v6.css'
      - 'jogos/fazendinha-experience-v6.js'
      - 'games-menu-farm.js'
      - 'extras-loader.js'
      - 'postboot-loader.js'
      - 'index.html'
      - 'acesso.html'
      - 'acesso-mobile.html'
      - '.github/workflows/validate-farm-multiplayer.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe
        run: |
          node --check jogos/fazendinha-experience-v6.js
          node --check games-menu-farm.js
          node --check extras-loader.js
          node --check postboot-loader.js
      - name: Verificar integração
        run: |
          test -s jogos/fazendinha-multiplayer.html
          test -s jogos/fazendinha-multiplayer.css
          test -s jogos/fazendinha-experience-v6.css
          test -s jogos/fazendinha-experience-v6.js
          grep -q 'Fazendinha Família Feliz' jogos/fazendinha-multiplayer.html
          grep -q 'fazendinha-experience-v6.js?v=7-natural-models' jogos/fazendinha-multiplayer.html
          grep -q 'camera360Btn' jogos/fazendinha-multiplayer.html
          grep -q 'eyeCameraBtn' jogos/fazendinha-multiplayer.html
          grep -q 'data-tool="fish"' jogos/fazendinha-multiplayer.html
          grep -q 'GLTFLoader' jogos/fazendinha-experience-v6.js
          grep -q 'Soldier.glb' jogos/fazendinha-experience-v6.js
          grep -q 'Michelle.glb' jogos/fazendinha-experience-v6.js
          grep -q 'Cow.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'Pig.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'Sheep.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'Horse.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'Pug.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'polishInterior' jogos/fazendinha-experience-v6.js
          grep -q 'OrbitControls' jogos/fazendinha-experience-v6.js
          grep -q "locationMode='inside'" jogos/fazendinha-experience-v6.js
          grep -q "kind:'door-enter'" jogos/fazendinha-experience-v6.js
          grep -q "kind:'rest'" jogos/fazendinha-experience-v6.js
          grep -q "kind:'eat'" jogos/fazendinha-experience-v6.js
          grep -q "kind:'fishspot'" jogos/fazendinha-experience-v6.js
          grep -q "doAction('fish'" jogos/fazendinha-experience-v6.js
          grep -q 'farm_game_bootstrap' jogos/fazendinha-experience-v6.js
          grep -q 'farm_game_snapshot' jogos/fazendinha-experience-v6.js
          grep -q 'farm_game_action' jogos/fazendinha-experience-v6.js
          grep -q "function eligible(){return currentName()==='isa'}" games-menu-farm.js
          grep -q 'v=7-natural-models' games-menu-farm.js
          grep -q "loadOnce('farm-game','./games-menu-farm.js?v=7-natural-models')" extras-loader.js
          grep -q 'postboot-loader.js?v=19-farm-v7' index.html
          ! grep -q 'games-menu-farm.js' acesso.html
          ! grep -q 'games-menu-farm.js' acesso-mobile.html
          ! grep -q 'Isa no notebook e Primo no celular' games-menu-farm.js
