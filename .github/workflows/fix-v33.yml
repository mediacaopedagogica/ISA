name: Fix app v33

on:
  push:
    paths:
      - '.github/workflows/fix-v33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        run: python scripts/patch-v33.py

      - name: Build v33 locally
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @supabase/supabase-js@2 esbuild@0.25.9
          cat > core-v33-entry.js <<'EOF'
          import { createClient } from '@supabase/supabase-js'
          import { CONFIG } from './config.js'
          window.__ISA_SCRIPT_LOADED__ = true;
          async function __isaCore33(){
          window.__ISA_CORE_STARTED__ = true;
          EOF
          cat chunk-00.txt chunk-01.txt chunk-02.txt chunk-03.txt chunk-04.txt chunk-05.txt chunk-06.txt chunk-07.txt chunk-08.txt chunk-09.txt >> core-v33-entry.js
          cat >> core-v33-entry.js <<'EOF'
          }
          __isaCore33().then(()=>{window.__ISA_APP_READY__=true;}).catch(error=>{
            console.error('Falha ao iniciar Cantinho da Isa:',error);
            window.__ISA_APP_ERROR__=String(error?.message||error||'Erro desconhecido');
            const msg=document.getElementById('loginMsg');
            if(msg){msg.textContent='O aplicativo não conseguiu iniciar. Recarregue a página.';msg.style.color='#a15472';}
          });
          EOF
          npx esbuild core-v33-entry.js --bundle --format=iife --platform=browser --target=es2020 --outfile=app-v33.js
          node --check app-v33.js
          grep -q 'presence-actions' app-v33.js
          grep -q 'Leu sua mensagem' app-v33.js
          grep -q 'read-receipt' app-v33.js

      - name: Commit v33
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chunk-02.txt chunk-05.txt chunk-06.txt chunk-08.txt chunk-09.txt heart-polish.css index.html app-v33.js
          git commit -m 'Fix read receipts presence supervision and layout v33'
          git push
