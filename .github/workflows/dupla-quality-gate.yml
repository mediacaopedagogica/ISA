name: Dupla na Pista Quality Gate
on:
  push:
    paths:
      - 'jogos/dupla-na-pista-teste.html'
      - 'jogos/dupla-na-pista/**'
      - 'scripts/test_dupla_driving_contract.py'
      - '.github/workflows/dupla-quality-gate.yml'
  pull_request:
    paths:
      - 'jogos/dupla-na-pista-teste.html'
      - 'jogos/dupla-na-pista/**'
      - 'scripts/test_dupla_driving_contract.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate audited driving behavior contract
        run: python scripts/test_dupla_driving_contract.py
      - name: Validate private-player and manual-driving rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('jogos/dupla-na-pista-teste.html').read_text()
          required=['preview','keise','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','quickBar','RaycastVehicle']
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing gameplay/private-preview markers: '+', '.join(missing))
          forbidden=['autopilot','autoPilot','AI_DRIVES_PLAYER']
          bad=[x for x in forbidden if x in html]
          if bad:
              raise SystemExit('Forbidden automatic driving markers: '+', '.join(bad))
          print('Private preview + manual driving rules: PASS')
          PY
