name: Run all profile mobile sync
on:
  push:
    paths:
      - '.github/workflows/run-sync-all-profile-mobile-features.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply all-profile mobile sync
        run: python scripts/sync_all_profile_mobile_features.py
      - name: Commit synced features
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games-menu.js games-menu-snake.js extras-loader.js profile-status-stickers.js acesso-mobile.html postboot-loader.js index.html
          git commit -m "fix: expose mobile features on every family profile"
          git push
