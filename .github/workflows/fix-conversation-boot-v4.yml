name: Fix conversation boot v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-conversation-boot-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch final live boot
        run: python scripts/fix_conversation_boot_v4.py

      - name: Check JavaScript syntax
        run: node --check app-v33.js

      - name: Verify final live boot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-v33.js').read_text()
          live=s.rsplit('    async function boot() {',1)[1].split('      hydrateAvatarElements().catch(() => {',1)[0]
          assert 'const coreLoad = Promise.allSettled([loadFamily(), loadConversations()]);' in live
          assert 'const bootChatList = $("chatList");' in live
          assert 'await Promise.all([loadFamily(), loadConversations()]);' not in live
          h=Path('index.html').read_text()
          assert 'stable-56-conversation-boot' in h
          assert 'coreReady=!list||!/Carregando conversas/i.test' in h
          print('final live conversation boot: OK')
          PY

      - name: Commit final repair
        shell: bash
        run: |
          if git diff --quiet -- app-v33.js index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v33.js index.html
          git commit -m 'fix: stop endless conversation loading on notebook and phone'
          git push
