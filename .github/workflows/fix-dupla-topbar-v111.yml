name: Fix Dupla top bar v1.1.1
on:
  push:
    paths: ['.github/workflows/fix-dupla-topbar-v111.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/dupla-na-pista-teste.html')
          s=p.read_text()
          s=s.replace('pista viva v1.0.3 • frente/ré + aceleração corrigidas','pista viva v1.1.1 • barra superior')
          s=s.replace('🧪 TESTE JOGO • KEISE • v1.0.3','🧪 TESTE JOGO • KEISE • v1.1.1')
          anchor='<button id="menuBtn">☰ Menu</button>'
          bar='<div id="quickBar"><select id="quickRoute"></select><button id="quickPilot">👤 P1</button><button id="quickCamera">📷</button><input id="quickColor" type="color" value="#f3f3ef"><button id="quickTurbo">⚡</button><button id="quickStart">🏁 Largar</button><button id="quickReset">↺</button></div>'+anchor
          if anchor not in s: raise SystemExit('menu marker missing')
          s=s.replace(anchor,bar,1)
          css='''#menuBtn,#menuLayer{display:none!important}#quickBar{position:fixed;z-index:58;left:50%;top:64px;transform:translateX(-50%);display:flex;gap:5px;align-items:center;max-width:calc(100vw - 20px);padding:5px;border-radius:12px;background:#091018d9;border:1px solid #ffffff20;backdrop-filter:blur(12px);overflow-x:auto;white-space:nowrap}#quickBar button,#quickBar select,#quickBar input{height:33px;flex:0 0 auto;border:1px solid #ffffff1a;border-radius:8px;background:#17202a;color:#fff;font-weight:800;font-size:10px}#quickBar button{padding:0 10px}#quickBar select{max-width:170px;padding:0 8px}#quickBar input{width:38px;padding:3px}#quickStart{background:#d82d34!important}@media(max-width:820px){#brand{display:none}#quickBar{left:6px;right:6px;top:38px;transform:none;max-width:none;padding:4px;gap:4px}#quickBar button,#quickBar select,#quickBar input{height:30px;font-size:9px}#quickBar select{max-width:120px}#quickBar button{padding:0 8px}#topHud{top:4px;width:calc(100% - 12px)}#progressWrap{top:32px;width:calc(100% - 18px)}#message{top:74px}}'''
          s=s.replace('</style>',css+'</style>',1)
          marker="$('testP2').onclick=()=>switchPilot(1);"
          js="""\nconst qr=$('quickRoute');RACES.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name;qr.appendChild(o)});qr.value=race.id;qr.onchange=()=>{const r=RACES.find(x=>x.id===qr.value);if(r){race=r;resetAll();renderRoutes();msg('🏁 '+r.name)}};$('quickStart').onclick=startRace;$('quickCamera').onclick=()=>$('cameraBtn').click();$('quickTurbo').onclick=turbo;$('quickReset').onclick=()=>{resetAll();msg('↺ Reiniciado')};$('quickPilot').onclick=()=>{const n=active?0:1;switchPilot(n);$('quickPilot').textContent=n?'👤 P2':'👤 P1'};$('quickColor').oninput=e=>paintLists[active].forEach(m=>{m.color?.set(e.target.value);m.needsUpdate=true});\n"""
          if marker not in s: raise SystemExit('js marker missing')
          s=s.replace(marker,marker+js,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/dupla-na-pista-teste.html
          git commit -m 'ui: move race controls to top bar'
          git push
