name: Cleanup conversation boot admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-conversation-boot-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean accidental admin patch
        run: python scripts/cleanup_conversation_boot_admin.py
      - name: Check JavaScript
        run: node --check app-v33.js
      - name: Verify cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-v33.js').read_text()
          perm=s.split('    function openPermissionDialog(id) {',1)[1].split('    function openPasswordDialog(id) {',1)[0]
          live=s.rsplit('    async function boot() {',1)[1].split('      hydrateAvatarElements().catch(() => {',1)[0]
          assert 'coreBootResult' not in perm
          assert 'await Promise.all([loadFamily(), loadConversations()]);' in perm
          assert 'const coreLoad = Promise.allSettled([loadFamily(), loadConversations()]);' in live
          assert 'const bootChatList = $("chatList");' in live
          assert 'stable-57-conversation-boot' in Path('index.html').read_text()
          print('cleanup OK')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- app-v33.js index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v33.js index.html
          git commit -m 'fix: finalize conversation boot recovery'
          git push
