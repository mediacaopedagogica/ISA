name: Upgrade Fazendinha reference realism v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-farm-realism-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply realism patch
        run: python scripts/patch-farm-v12.py
      - name: Build browser bundle v12
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jogos/fazendinha-experience-v6.js')
          s=p.read_text()
          repl={
            "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'":"import * as THREE from 'three'",
            "import { Sky } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/objects/Sky.js'":"import { Sky } from 'three/addons/objects/Sky.js'",
            "import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js'":"import { OrbitControls } from 'three/addons/controls/OrbitControls.js'",
            "import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js'":"import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'",
            "import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/RGBELoader.js'":"import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'",
            "import * as SkeletonUtils from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/SkeletonUtils.js'":"import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'",
            "import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/RoundedBoxGeometry.js'":"import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'",
          }
          for a,b in repl.items():
              if a not in s: raise SystemExit('missing import: '+a)
              s=s.replace(a,b)
          Path('jogos/.fazendinha-entry-v12.js').write_text(s)
          PY
          npm install --no-save three@0.180.0 esbuild@0.25.9
          npx esbuild jogos/.fazendinha-entry-v12.js --bundle --format=iife --target=es2020 --outfile=jogos/fazendinha-bundle-v12.js --log-level=info
          node --check jogos/fazendinha-bundle-v12.js
          rm -f jogos/.fazendinha-entry-v12.js package-lock.json
          rm -rf node_modules
      - name: Update HTML and cache chain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('jogos/fazendinha-multiplayer.html')
          s=h.read_text()
          s=re.sub(r'fazendinha-experience-v6\.css\?v=[^"\']+','fazendinha-experience-v6.css?v=12-reference-realism',s)
          s=re.sub(r'<script defer src="\./fazendinha-bundle-v\d+\.js\?v=[^"]+"></script>','<script defer src="./fazendinha-bundle-v12.js?v=12-reference-realism"></script>',s)
          h.write_text(s)
          g=Path('games-menu-farm.js');x=g.read_text();x=re.sub(r'fazendinha-multiplayer\.html\?v=[^&`]+','fazendinha-multiplayer.html?v=12-reference-realism',x);g.write_text(x)
          e=Path('extras-loader.js');x=e.read_text();x=re.sub(r'games-menu-farm\.js\?v=[^\'\"]+','games-menu-farm.js?v=12-reference-realism',x);e.write_text(x)
          p=Path('postboot-loader.js');x=p.read_text();x=re.sub(r'extras-loader\.js\?v=[^\'\"]+','extras-loader.js?v=32-farm-v12',x);p.write_text(x)
          i=Path('index.html');x=i.read_text();x=re.sub(r'postboot-loader\.js\?v=[^\'\"]+','postboot-loader.js?v=24-farm-v12',x);i.write_text(x)
          PY
      - name: Validate v12
        run: |
          node --check jogos/fazendinha-experience-v6.js
          node --check jogos/fazendinha-bundle-v12.js
          node --check games-menu-farm.js
          grep -q 'manual/examples/resources/models/animals/Cow.gltf' jogos/fazendinha-experience-v6.js
          grep -q 'fazendinha-bundle-v12.js?v=12-reference-realism' jogos/fazendinha-multiplayer.html
          grep -q 'getFarmLeafTexture' jogos/fazendinha-experience-v6.js
          grep -q 'addReferenceFarmDetails' jogos/fazendinha-experience-v6.js
      - name: Publish v12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jogos/fazendinha-experience-v6.js jogos/fazendinha-bundle-v12.js jogos/fazendinha-multiplayer.html games-menu-farm.js extras-loader.js postboot-loader.js index.html
          git commit -m 'Upgrade Fazendinha house barn animals and foliage v12'
          git push
