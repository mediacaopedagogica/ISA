name: Publish Alan band operations v1
on:
  push:
    paths:
      - 'alan-band-operations.js'
      - 'alan-band-operations.css'
      - 'extras-loader.js'
      - '.github/workflows/publish-alan-band-operations-v1.yml'
permissions:
  contents: write
jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Alan operations module
        run: |
          node --check alan-band-operations.js
          grep -q "alan-band-operations" extras-loader.js
          grep -q "Ficha de Produção do Evento" alan-band-operations.js
          grep -q "Rider Técnico" alan-band-operations.js
          grep -q "Prestação de Contas" alan-band-operations.js
      - name: Refresh loader cache versions
        run: |
          sed -i 's#extras-loader.js?v=36-alan-band-management#extras-loader.js?v=37-alan-band-operations#g' postboot-loader.js
          sed -i 's#postboot-loader.js?v=16-alan-band-management#postboot-loader.js?v=17-alan-band-operations#g' index.html
      - name: Publish cache refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add postboot-loader.js index.html
          git commit -m 'Publish Alan advanced band operations v1'
          git push
