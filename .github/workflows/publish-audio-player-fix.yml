name: Publish audio player fix

on:
  push:
    paths:
      - '.github/workflows/publish-audio-player-fix.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh audio player loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="./postboot-loader.js?v=11-audio-mime"
          new="./postboot-loader.js?v=12-audio-player"
          if old not in s:
              print('index already refreshed')
          else:
              p.write_text(s.replace(old,new))
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish audio playback fix"
          git push
