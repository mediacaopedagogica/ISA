<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#cdb8ff">
  <title>Recuperando Cantinho da Isa</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 15% 20%,#ffe5f0,transparent 35%),radial-gradient(circle at 85% 20%,#e7ddff,transparent 38%),linear-gradient(145deg,#f8f2ff,#eef7ff);color:#65536f;padding:24px}.card{width:min(460px,94vw);padding:30px;border-radius:34px;text-align:center;background:rgba(255,255,255,.82);box-shadow:0 22px 55px rgba(91,69,108,.15),inset 0 3px 0 #fff}.heart{width:72px;height:64px;margin:0 auto 18px;position:relative;transform:rotate(-45deg);border-radius:18px 0 18px 0;background:linear-gradient(145deg,rgba(244,172,211,.72),rgba(203,180,255,.72));box-shadow:0 12px 25px rgba(177,139,196,.2)}.heart:before,.heart:after{content:"";position:absolute;width:72px;height:64px;border-radius:50%;background:inherit}.heart:before{top:-34px;left:0}.heart:after{left:34px;top:0}h1{font-size:1.45rem;margin:8px 0}p{line-height:1.5;color:#88758f}.dots{font-size:1.5rem;letter-spacing:6px;color:#b69dd2}.error{color:#a55269}.btn{display:none;width:100%;border:0;border-radius:18px;padding:13px 16px;margin-top:15px;background:linear-gradient(145deg,#d2c1ff,#f0b2d2);color:white;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true"></div>
    <h1>Preparando o Cantinho da Isa</h1>
    <p id="status">Limpando a versão antiga para abrir a versão atual…</p>
    <div class="dots" aria-hidden="true">•••</div>
    <button id="continueBtn" class="btn" type="button">Abrir Cantinho da Isa</button>
  </main>
  <script>
    const statusEl=document.getElementById('status');
    const btn=document.getElementById('continueBtn');
    const go=()=>location.replace('./?recovery=30&t='+Date.now());
    btn.onclick=go;
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        try{localStorage.removeItem('isa_force_reload_v30')}catch{}
        statusEl.textContent='Pronto! Abrindo a versão atual…';
        setTimeout(go,350);
      }catch(error){
        console.error(error);
        statusEl.classList.add('error');
        statusEl.textContent='A limpeza automática não terminou. Clique abaixo para continuar.';
        btn.style.display='block';
      }
    })();
  </script>
</body>
</html>
