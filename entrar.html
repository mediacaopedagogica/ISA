<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cdb8ff">
<title>Cantinho da Isa • Acesso</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#65536f;background:radial-gradient(circle at 15% 15%,#fff0f6 0 18%,transparent 42%),radial-gradient(circle at 86% 12%,#eee4ff 0 18%,transparent 42%),#f8f2fb}.card{width:min(440px,94vw);padding:34px 28px;text-align:center;border-radius:32px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 55px rgba(95,70,110,.14);backdrop-filter:blur(18px)}.heart{font-size:48px;color:#dca7c9;text-shadow:0 8px 20px rgba(178,125,167,.2)}h1{margin:10px 0 6px;font-size:1.65rem}.muted{color:#92849a}.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #eadff3;border-top-color:#bca1e5;margin:22px auto 8px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:16px;padding:12px 16px;background:#e8dcff;font-weight:800;color:#655078;cursor:pointer}.hidden{display:none!important}.error{color:#a15472;font-weight:700}
</style>
</head>
<body>
<section class="card">
<div class="heart">♥</div>
<h1 id="title">Abrindo seu Cantinho…</h1>
<p id="text" class="muted">Seu acesso pessoal está sendo confirmado.</p>
<div id="spinner" class="spinner"></div>
<p id="error" class="error"></p>
<button id="retry" class="hidden" type="button">Tentar novamente</button>
</section>
<script type="module">
import {CONFIG} from './config.js';
const $=id=>document.getElementById(id);
const token=new URLSearchParams(location.hash.replace(/^#/,'' )).get('acesso')||'';
const STORAGE_KEY='sb-srazofmrxzwqcavnhplq-auth-token';
async function start(){
 $('retry').classList.add('hidden');$('error').textContent='';$('spinner').classList.remove('hidden');
 if(!token){fail('Este link não é válido.');return}
 try{
   const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/personal-link-session`,{method:'POST',headers:{apikey:CONFIG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});
   const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível acessar.');
   $('title').textContent=`Oi, ${d.name}! 💜`;$('text').textContent='Entrando…';
   const v=await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/verify`,{method:'POST',headers:{apikey:CONFIG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({type:d.type||'magiclink',token_hash:d.tokenHash})});
   const s=await v.json().catch(()=>({}));if(!v.ok||!s.access_token||!s.refresh_token)throw new Error(s.msg||s.error_description||'Não foi possível iniciar a sessão.');
   const expiresIn=Number(s.expires_in||3600);
   const session={access_token:s.access_token,refresh_token:s.refresh_token,expires_in:expiresIn,expires_at:Number(s.expires_at||Math.floor(Date.now()/1000)+expiresIn),token_type:s.token_type||'bearer',user:s.user||null};
   localStorage.setItem(STORAGE_KEY,JSON.stringify(session));
   sessionStorage.setItem('isa_direct_access','1');
   location.replace('./?acesso=direto&v=38');
 }catch(e){fail(e.message||'Não foi possível acessar.')}
}
function fail(msg){$('spinner').classList.add('hidden');$('title').textContent='Acesso indisponível';$('text').textContent='';$('error').textContent=msg;$('retry').classList.remove('hidden')}
$('retry').onclick=start;start();
</script>
</body>
</html>
