<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#cdb8ff"><title>Cantinho da Isa • Mobile</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",system-ui,sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:22px;color:#65536f;background:radial-gradient(circle at 15% 15%,#fff0f6 0 18%,transparent 42%),radial-gradient(circle at 86% 12%,#eee4ff 0 18%,transparent 42%),#f8f2fb}.card{width:min(420px,94vw);padding:30px 26px;text-align:center;border-radius:28px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.96);box-shadow:0 18px 48px rgba(95,70,110,.13)}.heart{font-size:46px;color:#dca7c9}h1{margin:10px 0 6px;font-size:1.5rem}.muted{color:#92849a}.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #eadff3;border-top-color:#bca1e5;margin:20px auto 6px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{color:#a15472;font-weight:700}.hidden{display:none!important}button{border:0;border-radius:14px;padding:11px 15px;background:#e8dcff;font-weight:800;color:#655078}</style>
</head><body><section class="card"><div class="heart">♥</div><h1 id="title">Abrindo versão mobile…</h1><p id="text" class="muted">Confirmando seu acesso.</p><div id="spinner" class="spinner"></div><p id="error" class="error"></p><button id="retry" class="hidden" type="button">Tentar novamente</button></section>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import {CONFIG} from './config.js';
const $=id=>document.getElementById(id);const rawHash=location.hash;const token=new URLSearchParams(rawHash.replace(/^#/,'' )).get('acesso')||'';history.replaceState(null,'',location.pathname+location.search);
const supabase=createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let running=false;
function fail(msg){running=false;$('spinner').classList.add('hidden');$('title').textContent='Acesso indisponível';$('text').textContent='';$('error').textContent=msg;$('retry').classList.remove('hidden')}
async function start(){if(running)return;running=true;$('retry').classList.add('hidden');$('error').textContent='';$('spinner').classList.remove('hidden');if(!token)return fail('Este link mobile não é válido.');try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/personal-link-session`,{method:'POST',headers:{apikey:CONFIG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',signal:controller.signal});clearTimeout(timeout);const d=await r.json().catch(()=>({}));if(!r.ok||!d.tokenHash)throw new Error(d.error||'Não foi possível iniciar seu acesso.');const name=['Keise','Alan','Isa'].includes(d.name)?d.name:'Família';$('title').textContent=`Oi, ${name}!`;$('text').textContent='Abrindo sua versão para celular…';const {data,error}=await supabase.auth.verifyOtp({token_hash:d.tokenHash,type:d.verificationType||'magiclink'});if(error||!data?.session)throw new Error(error?.message||'Não foi possível confirmar a sessão.');const {data:stored}=await supabase.auth.getSession();if(!stored?.session)throw new Error('A sessão não foi salva.');await new Promise(r=>setTimeout(r,180));const u=new URL('./',location.href);u.searchParams.set('mobile','1');u.searchParams.set('perfil',name);u.searchParams.set('entrada','mobile');u.searchParams.set('v','3');location.replace(u.href)}catch(e){fail(e?.name==='AbortError'?'A conexão demorou demais. Tente novamente.':(e?.message||'Não foi possível acessar.'))}}
$('retry').onclick=start;start();
</script></body></html>
